syntax = "proto3";

package gibson.types.v1;

option go_package = "github.com/zeroroot-ai/sdk/api/gen/gibson/types/v1;typespb";
option java_multiple_files = true;
option csharp_namespace = "Gibson.Types";

import "gibson/common/v1/gibson_common.proto";
import "gibson/job/v1/job.proto";

// ResultStatus represents the execution status of a task or operation.
enum ResultStatus {
  RESULT_STATUS_UNSPECIFIED = 0;
  RESULT_STATUS_SUCCESS = 1;
  RESULT_STATUS_FAILED = 2;
  RESULT_STATUS_PARTIAL = 3;
  RESULT_STATUS_CANCELLED = 4;
  RESULT_STATUS_TIMEOUT = 5;
}

// FindingSeverity represents the severity level of a security finding.
enum FindingSeverity {
  FINDING_SEVERITY_UNSPECIFIED = 0;
  FINDING_SEVERITY_CRITICAL = 1;
  FINDING_SEVERITY_HIGH = 2;
  FINDING_SEVERITY_MEDIUM = 3;
  FINDING_SEVERITY_LOW = 4;
  FINDING_SEVERITY_INFO = 5;
}

// FindingStatus represents the current status of a security finding.
enum FindingStatus {
  FINDING_STATUS_UNSPECIFIED = 0;
  FINDING_STATUS_OPEN = 1;
  FINDING_STATUS_CONFIRMED = 2;
  FINDING_STATUS_CLOSED = 3;
  FINDING_STATUS_FALSE_POSITIVE = 4;
}

// EvidenceType is the one list of evidence types. Each evidence shape in the
// platform uses this list.
enum EvidenceType {
  EVIDENCE_TYPE_UNSPECIFIED = 0;
  EVIDENCE_TYPE_REQUEST = 1;
  EVIDENCE_TYPE_RESPONSE = 2;
  EVIDENCE_TYPE_SCREENSHOT = 3;
  EVIDENCE_TYPE_CODE = 4;
  EVIDENCE_TYPE_LOG = 5;
  EVIDENCE_TYPE_OTHER = 6;
  EVIDENCE_TYPE_PAYLOAD = 7;
  // EVIDENCE_TYPE_CONVERSATION is a dialogue with a target. Gibson tests
  // targets that are models, so a dialogue is evidence.
  EVIDENCE_TYPE_CONVERSATION = 8;
  EVIDENCE_TYPE_NETWORK_TRACE = 9;
}

// EvidenceTier tells a reader how much to trust an evidence item. The daemon
// sets the tier. An agent cannot set it.
enum EvidenceTier {
  EVIDENCE_TIER_UNSPECIFIED = 0;
  // EVIDENCE_TIER_RECORDED is tier 1. A tool call id backs the item, and the
  // daemon built the content from its own record of that tool call.
  EVIDENCE_TIER_RECORDED = 1;
  // EVIDENCE_TIER_TYPED is tier 2. The agent typed the content.
  EVIDENCE_TIER_TYPED = 2;
}

// Task represents a goal-oriented task with context and constraints.
//
// context is free-form: the daemon does not read it. Anything the daemon
// must enforce lives in a declared field. Resources a dispatched task needs
// (repositories, credential names, World inputs, acceptance) live in job,
// because the daemon reads them before it mints the task grant.
message Task {
  string id = 1;
  string goal = 2;
  map<string, gibson.common.v1.TypedValue> context = 3;
  TaskConstraints constraints = 4;
  map<string, gibson.common.v1.TypedValue> metadata = 5;

  // job names the typed resources this task needs and how it is judged.
  // It is set when the task opens or continues a job on a
  // bank member. goal stays the goal; the spec's own goal is ignored on a
  // dispatched task. Absent on a task that needs no repository, no
  // credential and no acceptance step.
  gibson.job.v1.JobSpec job = 6;

  // Field 7 held pinned_skills for one release. The pinned Agent Skill ids now
  // ride in the Gibson run envelope of the A2A message of the work item, so
  // one place carries them. The number and the name stay reserved.
  reserved 7;
  reserved "pinned_skills";
}

// TaskConstraints represents execution constraints for a task.
message TaskConstraints {
  int32 max_turns = 1;
  int32 max_tokens = 2;
  repeated string allowed_tools = 3;
  repeated string blocked_tools = 4;
}

// Result represents the outcome of a task execution.
message Result {
  ResultStatus status = 1;
  gibson.common.v1.TypedValue output = 2;
  repeated string finding_ids = 3;
  map<string, gibson.common.v1.TypedValue> metadata = 4;
  ResultError error = 5;
}

// ResultError represents a structured error with retry information.
message ResultError {
  gibson.common.v1.ErrorCode code = 1;
  string message = 2;
  map<string, string> details = 3;
  bool retryable = 4;
}

// Finding represents a security vulnerability or issue discovered during testing.
message Finding {
  string id = 1;
  string mission_id = 2;
  string agent_name = 3;
  string delegated_from = 4;
  string title = 5;
  string description = 6;
  string category = 7;
  string subcategory = 8;
  FindingSeverity severity = 9;
  double confidence = 10;
  FindingStatus status = 11;
  MitreMapping mitre_attack = 12;
  MitreMapping mitre_atlas = 13;
  repeated Evidence evidence = 14;
  repeated ReproStep reproduction = 15;
  double cvss_score = 16;
  double risk_score = 17;
  string remediation = 18;
  repeated string references = 19;
  string target_id = 20;
  string technique = 21;
  repeated string tags = 22;
  int64 created_at = 23;  // Unix timestamp in milliseconds
  int64 updated_at = 24;  // Unix timestamp in milliseconds

  reserved 25;
  reserved "compliance_mappings";
}

// MitreMapping represents a mapping to MITRE ATT&CK or ATLAS framework.
message MitreMapping {
  string matrix = 1;
  string tactic_id = 2;
  string tactic_name = 3;
  string technique_id = 4;
  string technique_name = 5;
  repeated string sub_techniques = 6;
}

// Evidence represents supporting evidence for a finding.
message Evidence {
  string title = 1;
  EvidenceType type = 2;
  string content = 3;
  map<string, string> metadata = 4;

  // tier is set by the daemon. The daemon ignores a value that an agent sends.
  EvidenceTier tier = 5;

  // tool_call_id is set by the daemon on a tier 1 item. It is the id of the
  // recorded tool call that backs the item. It is empty on a tier 2 item. The
  // daemon ignores a value that an agent sends. An agent names a tool call in
  // the tool_call_ids field of the request.
  string tool_call_id = 6;
}

// ReproStep represents a step in reproducing a finding.
message ReproStep {
  int32 order = 1;
  string description = 2;
  string input = 3;
  string output = 4;
}

// MissionRunSummary describes one run of a mission.
//
// Returned by the GetMissionRunHistory knowledge read. An agent lists the runs,
// then pulls findings for a previous one with GetRunFindings — the two are
// consumed together, which is why run history sits with the knowledge reads and
// not with mission lifecycle control.
message MissionRunSummary {
  string mission_id = 1;
  // run_number is sequential from 1.
  int32 run_number = 2;
  // status is the final status of this run.
  string status = 3;
  int32 findings_count = 4;
  int64 created_at = 5;
  // completed_at is 0 while the run is still in flight.
  int64 completed_at = 6;
}
