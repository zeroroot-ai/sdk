syntax = "proto3";

// Package gibson.agentidentity.v1 — AgentIdentityService: customer-callable
// machine-identity provisioning surface and the developer enrollment dev-loop
// (`gibson agent`). Re-homed out of
// gibson.tenant.v1 into its own wire package so it can stay in the OSS SDK
// while the nine tenant-administration services move to the gibson platform
// protos under the unchanged gibson.tenant.v1 package — keeping both in one
// package would link two generated Go homes for gibson.tenant.v1 into the
// daemon (proto: duplicate registration). See ADR-0058 (amended 2026-06-22).
package gibson.agentidentity.v1;

option go_package = "github.com/zeroroot-ai/sdk/api/gen/gibson/agentidentity/v1;agentidentityv1";

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "gibson/auth/v1/options.proto";

// AgentIdentityService provisions and manages machine identities for agents,
// tools, and plugins.
service AgentIdentityService {
  // CreateAgentIdentity provisions a new machine identity for an agent, tool,
  // or plugin. Returns a one-time capability-grant bootstrap_token that cannot
  // be recovered after this call (ADR-0045 — the unified enrollment credential
  // for every kind).
  rpc CreateAgentIdentity(CreateAgentIdentityRequest) returns (CreateAgentIdentityResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "writer"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 3  // USER | SERVICE
    };
  }
  // ListAgentIdentities returns all agent/tool/plugin identities provisioned in
  // the caller's tenant, with optional kind filtering and pagination.
  rpc ListAgentIdentities(ListAgentIdentitiesRequest) returns (ListAgentIdentitiesResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "writer"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 3  // USER | SERVICE
    };
  }
  // RevokeAgentIdentity permanently revokes a machine identity. Existing JWTs
  // stop validating within the IdP token TTL (<=60 seconds). Idempotent on
  // already-revoked principals (returns NotFound).
  rpc RevokeAgentIdentity(RevokeAgentIdentityRequest) returns (RevokeAgentIdentityResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "writer"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 3  // USER | SERVICE
    };
  }
}

// ---------------------------------------------------------------------------
// Agent identity messages
// ---------------------------------------------------------------------------

// PrincipalKind identifies the type of machine principal being provisioned.
enum PrincipalKind {
  PRINCIPAL_KIND_UNSPECIFIED = 0;
  PRINCIPAL_KIND_AGENT = 1;
  PRINCIPAL_KIND_TOOL = 2;
  PRINCIPAL_KIND_PLUGIN = 3;
}

// ComponentGrant describes an optional FGA capability grant to apply at
// creation time.
message ComponentGrant {
  // component_ref is the component reference, e.g. "tool:nmap" or
  // "plugin:gitlab".
  string component_ref = 1;
  // relation is the FGA relation to grant, e.g. "can_invoke".
  string relation = 2;
}

// CreateAgentIdentityRequest is the input to AgentIdentityService.CreateAgentIdentity.
message CreateAgentIdentityRequest {
  // name must match ^[a-z][a-z0-9-]{2,40}$
  string name = 1 [(buf.validate.field).string = { max_len: 1024 }];
  // kind must not be UNSPECIFIED.
  PrincipalKind kind = 2 [(buf.validate.field).enum = { defined_only: true }];
  // description is optional, max 256 chars.
  string description = 3 [(buf.validate.field).string = { max_len: 16777216 }];
  // component_grants is an optional list of FGA capability grants to apply at
  // creation.
  repeated ComponentGrant component_grants = 4;
  // capability_ceiling names the session capabilities the enrolling admin
  // grants this identity, minted into its bootstrap credential's ceiling
  // (ADR-0045). Only the reserved names are accepted: "mission:originate"
  // (start a mission of its own, the interactive coding-agent case) and
  // "mission:delegate". Empty means neither.
  repeated string capability_ceiling = 5;

  // idempotency_key makes a retry safe (ADR-0028). A second request with the
  // same key returns the result of the first request and does the work one
  // time. An empty key turns the protection off for the call.
  string idempotency_key = 6 [(buf.validate.field).string = { max_len: 128 }];
}

// CreateAgentIdentityResponse carries the provisioned identity credentials.
// The bootstrap_token is emitted exactly once and cannot be recovered.
message CreateAgentIdentityResponse {
  // Fields 4 (client_id) and 5 (client_secret) carried the OAuth2
  // client_credentials grant. They were removed when enrollment unified on the
  // one capability-grant handshake (ADR-0045): no OAuth client is provisioned
  // for machine principals; bootstrap_token is the sole credential.
  //
  // Field 7 (enroll_command) carried a shell command for a CLI verb that no
  // longer exists. Enrollment needs no CLI verb (ADR-0097): a developer sets
  // GIBSON_BOOTSTRAP_TOKEN and GIBSON_URL and starts the component.
  //
  // The field numbers and names are reserved so they are never reused.
  reserved 4, 5, 7;
  reserved "client_id", "client_secret", "enroll_command";

  // principal_id is the FGA principal identifier (e.g. "agent_principal:uuid").
  string principal_id = 1;
  PrincipalKind kind = 2;
  string name = 3;
  // gibson_url is the public URL of the daemon. The component reads it from
  // GIBSON_URL when it starts.
  string gibson_url = 6;
  // bootstrap_token is a one-time, daemon-signed Capability-Grant bootstrap
  // credential. The component reads it from GIBSON_BOOTSTRAP_TOKEN when it
  // starts and presents it to the CG register endpoint to complete its FIRST
  // host registration (it carries no Capability Grant yet). Under the
  // unified-identity model (ADR-0045) it is the sole enrollment credential for
  // every kind. Store it immediately; it will not be shown again.
  string bootstrap_token = 8;
}

// ListAgentIdentitiesRequest is the input to AgentIdentityService.ListAgentIdentities.
message ListAgentIdentitiesRequest {
  // page_size defaults to 50, max 200.
  int32 page_size = 1;
  string page_token = 2 [(buf.validate.field).string = { max_len: 16777216 }];
  // kind_filter: UNSPECIFIED means return all kinds.
  PrincipalKind kind_filter = 3 [(buf.validate.field).enum = { defined_only: true }];
}

// AgentIdentity is a single entry in the list response.
message AgentIdentity {
  string principal_id = 1;
  PrincipalKind kind = 2;
  string name = 3;
  string description = 4;
  google.protobuf.Timestamp created_at = 5;
  // last_authenticated_at is null if never authenticated or unsupported by the
  // IdP.
  google.protobuf.Timestamp last_authenticated_at = 6;
  bool revoked = 7;
  string created_by_subject = 8;
}

// ListAgentIdentitiesResponse is the output of
// AgentIdentityService.ListAgentIdentities.
message ListAgentIdentitiesResponse {
  repeated AgentIdentity identities = 1;
  string next_page_token = 2;
}

// RevokeAgentIdentityRequest is the input to AgentIdentityService.RevokeAgentIdentity.
message RevokeAgentIdentityRequest {
  string principal_id = 1 [(buf.validate.field).string = { min_len: 1, max_len: 1024 }];
}

// RevokeAgentIdentityResponse is the output of
// AgentIdentityService.RevokeAgentIdentity.
message RevokeAgentIdentityResponse {}
