message ValidateRelationshipRequest {
    ContextInfo context = 1;
    string relationship_type = 2 [(buf.validate.field).string = { max_len: 1024 }];
    string from_node_type = 3 [(buf.validate.field).string = { max_len: 1024 }];
    string to_node_type = 4 [(buf.validate.field).string = { max_len: 1024 }];
    map<string, gibson.common.v1.TypedValue> properties = 5;
}

message ValidationResponse {
    bool valid = 1;
    repeated ValidationError errors = 2;
    repeated string warnings = 3;
    HarnessError error = 4;
}

message ValidateFindingResponse {
    bool valid = 1;
    repeated ValidationError errors = 2;
    repeated string warnings = 3;
    HarnessError error = 4;
}

message ValidateGraphNodeResponse {
    bool valid = 1;
