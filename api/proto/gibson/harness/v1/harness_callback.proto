message ValidationError {
    string field = 1;
    string message = 2;
    string code = 3;  // e.g., "MISSING_REQUIRED", "INVALID_ENUM", "UNKNOWN_TYPE"
}

// ============================================================================
// Mission Management Operations
// ============================================================================

// MissionStatus represents the current state of a mission.
enum MissionStatus {
    MISSION_STATUS_UNSPECIFIED = 0;
    MISSION_STATUS_PENDING = 1;
    MISSION_STATUS_RUNNING = 2;
    MISSION_STATUS_PAUSED = 3;
    MISSION_STATUS_COMPLETED = 4;
    MISSION_STATUS_FAILED = 5;
    MISSION_STATUS_CANCELLED = 6;
}

// MissionConstraints limits mission execution to prevent resource exhaustion.
//
// Deprecated: use gibson.mission.v1.MissionConstraints via the
// canonical_constraints field on CreateMissionRequest instead.
// This type will be removed in a follow-up release after all microVM
// consumers have migrated.
message MissionConstraints {
    option deprecated = true;

    int64 max_duration_ms = 1;   // Maximum duration in milliseconds (0 = no limit)
    int64 max_tokens = 2;         // Maximum LLM tokens (0 = no limit)
    double max_cost = 3;          // Maximum dollar cost (0 = no limit)
    int32 max_findings = 4;       // Maximum findings count (0 = no limit)
}

// MissionMetrics aggregates execution statistics.
message MissionMetrics {
    int64 duration_ms = 1;        // Total execution time in milliseconds
    int64 tokens_used = 2;        // Total LLM tokens consumed
    int32 tool_calls = 3;         // Number of tool invocations
    int32 agent_calls = 4;        // Number of sub-agent invocations
    int32 findings_count = 5;     // Total findings generated
}

// MissionInfo provides metadata about a mission.
message MissionInfo {
    string id = 1;
    string name = 2;
    MissionStatus status = 3;
    string target_id = 4;
    string parent_mission_id = 5;  // Empty for root missions
    int64 created_at = 6;          // Unix timestamp in milliseconds
    repeated string tags = 7;
}

// MissionStatusInfo provides detailed status of a running mission.
message MissionStatusInfo {
    MissionStatus status = 1;
    double progress = 2;           // Completion percentage (0.0 to 1.0)
    string phase = 3;              // Current mission phase/step
    map<string, int32> finding_counts = 4;  // Severity -> count
    int64 token_usage = 5;         // Cumulative tokens consumed
    int64 duration_ms = 6;         // Elapsed execution time
    string error = 7;              // Error details if failed
}

// MissionResult contains final results of a completed mission.
message MissionResult {
    string mission_id = 1;
    MissionStatus status = 2;
    repeated gibson.types.v1.Finding findings = 3;
    map<string, gibson.common.v1.TypedValue> output = 4;
    MissionMetrics metrics = 5;
    string error = 6;
    int64 completed_at = 7;        // Unix timestamp in milliseconds
}

// MissionFilter specifies criteria for listing missions.
message MissionFilter {
    MissionStatus status = 1;  // Filter by status (0 = no filter)
    string target_id = 2;          // Filter by target ID
    string parent_mission_id = 3;  // Filter by parent mission
    int64 created_after = 4;       // Unix timestamp filter
    int64 created_before = 5;      // Unix timestamp filter
    repeated string tags = 6;      // Filter by tags (all must match)

    // The limit and offset fields are reserved. A list request uses page_size
    // and page_token (ADR-0028, rule 3).
    reserved 7, 8;
    reserved "limit", "offset";
}

// OriginationStart selects the state that an originated mission starts from.
enum OriginationStart {
    // ORIGINATION_START_UNSPECIFIED means a fresh sandbox.
    ORIGINATION_START_UNSPECIFIED = 0;
    // ORIGINATION_START_CALLER_STATE means the state that the caller has at
    // the time of the call. The child mission is a fork of the caller.
    ORIGINATION_START_CALLER_STATE = 1;
}

// CreateMissionRequest creates a new mission from a mission definition.
message CreateMissionRequest {
    ContextInfo context = 1;
    bytes mission_definition_json = 2;  // JSON-serialized mission definition
    string target_id = 3 [(buf.validate.field).string = { max_len: 1024 }];
    string name = 4 [(buf.validate.field).string = { max_len: 1024 }]; // Optional human-readable name

    // Deprecated: use canonical_constraints (field 8) instead.
    // constraints uses the harness-local MissionConstraints shape which only
    // carries max_duration_ms (int64 ms), max_tokens, max_cost, and max_findings.
    // It will be removed in a follow-up release once all microVM consumers
    // have migrated to canonical_constraints.
    MissionConstraints constraints = 5 [deprecated = true];

    map<string, gibson.common.v1.TypedValue> metadata = 6;
    repeated string tags = 7;

    // canonical_constraints carries the platform-canonical
    // gibson.mission.v1.MissionConstraints type (ADR 0004).
    // Prefer this field over the deprecated constraints (field 5).
    // The daemon merges canonical_constraints with any constraints baked
    // into the mission definition (dispatch wins on conflict).
    // Absent means no dispatch-time constraint overrides.
    gibson.mission.v1.MissionConstraints canonical_constraints = 8;

    // catalog_mission names a mission definition checked into the platform's
    // mission catalog, to be originated instead of a caller-supplied graph
    // (ADR-0118: the checked-in definition is authoritative).
    //
    // This is a second *input* to the one mission-creation route, deliberately
    // not a second RPC. A dedicated RPC would carry its own authorization
    // surface, so the per-tenant gate and the ADR-0063 origination rule ("a
    // component originates only from inside a live parent") would be enforced
    // in two places — which is where two enforcement paths drift apart.
    //
    // Exactly one of mission_definition_json (field 2) or catalog_mission must
    // be set. Both is InvalidArgument; neither is InvalidArgument.
    string catalog_mission = 9 [(buf.validate.field).string = { max_len: 4096 }];

    // catalog_params carries the parameters the named catalog mission declares,
    // keyed by the definition's own parameter names.
    //
    // The map is CLOSED: the daemon refuses an unrecognised key rather than
    // ignoring it. Silently dropping a key a caller sent would let that caller
    // believe a parameter bound when it did not — which is what keeps the
    // runtime target out of this map honest. The target continues to bind from
    // target_id (field 3) alone, so a scan can only ever run against a target
    // the tenant registered.
    //
    // Every missing parameter is reported at once rather than one render at a
    // time. Only meaningful when catalog_mission is set.
    map<string, string> catalog_params = 10;

    // starts_from selects the state that the new mission starts from
    // (ADR-0169). An agent forks at run time when it originates a child
    // mission with ORIGINATION_START_CALLER_STATE. The origination bounds
    // still apply to a fork: the budget comes from the remainder of the
    // parent, the targets are a subset, and the depth limit holds (ADR-0063).
    // The child gets the network scope of its own nodes, never the scope of
    // the caller.
    OriginationStart starts_from = 11 [(buf.validate.field).enum = { defined_only: true }];

    // workflow_json (field 2) was renamed to mission_definition_json under spec
    // mission-api-only-cleanup (Phase 3); the old name is reserved.
    reserved "workflow_json";

    // idempotency_key makes a retry safe (ADR-0028). A second request with the
    // same key returns the result of the first request and does the work one
    // time. An empty key turns the protection off for the call.
    string idempotency_key = 12 [(buf.validate.field).string = { max_len: 128 }];
}

// CreateMissionResponse returns the created mission info.
message CreateMissionResponse {
    MissionInfo mission = 1;
    HarnessError error = 2;
}

// RunMissionRequest queues a mission for execution.
message RunMissionRequest {
    ContextInfo context = 1;
    string mission_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
    bool wait = 3;                 // Block until completion
    int64 timeout_ms = 4;          // Timeout in milliseconds (when wait=true)

    // idempotency_key makes a retry safe (ADR-0028). A second request with the
    // same key returns the result of the first request and does the work one
    // time. An empty key turns the protection off for the call.
    string idempotency_key = 5 [(buf.validate.field).string = { max_len: 128 }];
}

// RunMissionResponse confirms mission execution started.
message RunMissionResponse {
    HarnessError error = 1;
}

// GetMissionStatusRequest retrieves current mission status.
message GetMissionStatusRequest {
    ContextInfo context = 1;
    string mission_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// GetMissionStatusResponse returns detailed status info.
message GetMissionStatusResponse {
    MissionStatusInfo status = 1;
    HarnessError error = 2;
}

// WaitForMissionRequest blocks until mission completion.
message WaitForMissionRequest {
    ContextInfo context = 1;
    string mission_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
    int64 timeout_ms = 3;          // 0 = no timeout
}

// WaitForMissionResponse returns final mission result.
message WaitForMissionResponse {
    MissionResult result = 1;
    HarnessError error = 2;
}

// ListMissionsRequest queries missions matching filter criteria.
message ListMissionsRequest {
    ContextInfo context = 1;
    MissionFilter filter = 2;

    // page_size is the most items for one page. 0 means the default of the
    // server. The server can return fewer items.
    int32 page_size = 3 [(buf.validate.field).int32 = { gte: 0, lte: 1000 }];

    // page_token is the next_page_token of the previous response. Empty means
    // the first page.
    string page_token = 4 [(buf.validate.field).string = { max_len: 1024 }];
}

// ListMissionsResponse returns matching missions.
message ListMissionsResponse {
    repeated MissionInfo missions = 1;
    HarnessError error = 2;

    // next_page_token is the page_token of the next page. Empty means that
    // this page is the last one.
    string next_page_token = 3;
}

// CancelMissionRequest requests cancellation of a running mission.
message CancelMissionRequest {
    ContextInfo context = 1;
    string mission_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// CancelMissionResponse confirms cancellation request.
message CancelMissionResponse {
    HarnessError error = 1;
}

// GetMissionResultsRequest retrieves completed mission results.
message GetMissionResultsRequest {
    ContextInfo context = 1;
    string mission_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// GetMissionResultsResponse returns mission results.
message GetMissionResultsResponse {
    MissionResult result = 1;
    HarnessError error = 2;
}

// ============================================================================
// Authorization Operations
// ============================================================================

// AuthorizeRequest asks the daemon whether the current work execution is
// permitted to perform action on resource. The daemon resolves run_id to
// the (user_id, tenant_id) that owns this mission run, then calls FGA.
message AuthorizeRequest {
    // run_id is the mission run ID embedded in the work envelope's AuthzContext.
    // The daemon uses it to look up the active mission's user and tenant.
    string run_id = 1 [(buf.validate.field).string = { max_len: 1024 }];

    // action is one of: execute, configure, read, write.
    // Maps to FGA relation "can_{action}" in the authorization model.
    string action = 2 [(buf.validate.field).string = { max_len: 4096 }];

    // resource is the FGA object in "<type>:<name>" format, e.g. "tool:mytool".
    string resource = 3 [(buf.validate.field).string = { max_len: 4096 }];
}

// AuthorizeResponse returns the authorization decision.
message AuthorizeResponse {
    // allowed is true if the action is permitted, false if denied.
    bool allowed = 1;

    // reason is a human-readable explanation, populated only on deny.
    // It does not expose internal FGA object names or user IDs.
    string reason = 2;
}

// ============================================================================
// Mission Memory: Cross-Run History Operations (Spec 5 R6)
// ============================================================================

// MissionRunSummary is the proto wire type for types.MissionRunSummary,
// used by GetMissionRunHistory to return chronological run records to
// the SDK CallbackHarness.
//
// Spec: headline-feature-completion R6.1.
message MissionRunSummary {
    // mission_id uniquely identifies this run.
    string mission_id = 1;
    // run_number is the sequential run number for this mission name (1-based).
    int32 run_number = 2;
    // status is the final status string (`running`, `completed`, `failed`, `cancelled`, `paused`).
    string status = 3;
    // findings_count is the number of findings discovered in this run.
    int32 findings_count = 4;
    // created_at is when the run was created (Unix epoch seconds).
    int64 created_at_unix = 5;
    // completed_at_unix is when the run completed (Unix epoch seconds, 0 if still running).
    int64 completed_at_unix = 6;
}

// ============================================================================
// Workspace operations — request/response messages
// Spec: callback-harness-workspace-rpcs.
// Mirrors codegen/workspace.Workspace's file-IO + commit/push
// surface. Editor and full GitOps are intentionally not exposed here.
// ============================================================================

// WorkspaceInfo is the minimal name + path projection of a workspace.
message WorkspaceInfo {
    // name is the repository identifier from the mission's WorkspaceConfig.
    string name = 1;
    // path is the absolute path to the workspace root on the daemon. Useful
    // for log attribution; the callback agent does not access this path.
    string path = 2;
}

// WorkspaceListRequest enumerates workspaces for the calling mission.
// The mission scope is derived from the request context (set by the SDK
// CallbackClient via contextInfo() — same pattern as the memory RPCs).
message WorkspaceListRequest {
    ContextInfo context = 1;
}

// WorkspaceListResponse carries every workspace in the mission.
message WorkspaceListResponse {
    repeated WorkspaceInfo workspaces = 1;
}

// WorkspaceGetInfoRequest fetches metadata for a single workspace.
message WorkspaceGetInfoRequest {
    ContextInfo context = 1;
    // Empty name resolves to the mission's primary workspace
    // (single-repository missions).
    string name = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// WorkspaceGetInfoResponse carries the requested workspace metadata.
message WorkspaceGetInfoResponse {
    // Absent on NOT_FOUND.
    WorkspaceInfo workspace = 1;
}

// WorkspaceReadFileRequest reads a file from a workspace.
message WorkspaceReadFileRequest {
    ContextInfo context = 1;
    // Empty workspace_name resolves to the primary workspace.
    string workspace_name = 2 [(buf.validate.field).string = { max_len: 1024 }];
    // Path is relative to the workspace root.
    string path = 3 [(buf.validate.field).string = { max_len: 4096 }];
}

// WorkspaceReadFileResponse carries the file's full content.
message WorkspaceReadFileResponse {
    bytes content = 1;
}

// WorkspaceWriteFileRequest writes content to a file in a workspace.
message WorkspaceWriteFileRequest {
    ContextInfo context = 1;
    // Empty workspace_name resolves to the primary workspace.
    string workspace_name = 2 [(buf.validate.field).string = { max_len: 1024 }];
    // Path is relative to the workspace root.
    string path = 3 [(buf.validate.field).string = { max_len: 4096 }];
    // Content is the new file body. RESOURCE_EXHAUSTED if > 16 MB.
    bytes content = 4;
}

// WorkspaceWriteFileResponse is empty on success.
message WorkspaceWriteFileResponse {}

// WorkspaceListFilesRequest enumerates workspace files matching a glob.
message WorkspaceListFilesRequest {
    ContextInfo context = 1;
    // Empty workspace_name resolves to the primary workspace.
    string workspace_name = 2 [(buf.validate.field).string = { max_len: 1024 }];
    // pattern is a glob matched relative to the workspace root.
    // Examples: "*.go", "**/*.py", "src/**/*.ts".
    string pattern = 3 [(buf.validate.field).string = { max_len: 4096 }];
}

// WorkspaceListFilesResponse carries the matched paths, with a truncation
// flag when the result set exceeded the 10,000-path cap.
message WorkspaceListFilesResponse {
    repeated string paths = 1;
    // truncated is true when the result was capped at 10,000 paths and more
    // matches exist. Refine the pattern to drill in.
    bool truncated = 2;
}

// WorkspaceCommitRequest stages all changes and creates a commit.
message WorkspaceCommitRequest {
    ContextInfo context = 1;
    // Empty workspace_name resolves to the primary workspace.
    string workspace_name = 2 [(buf.validate.field).string = { max_len: 1024 }];
    // message is the commit message. Required.
    string message = 3 [(buf.validate.field).string = { min_len: 1, max_len: 16777216 }];
}

// WorkspaceCommitResponse carries the new commit's SHA.
message WorkspaceCommitResponse {
    string commit_sha = 1;
}

// WorkspacePushRequest pushes committed changes to the workspace's remote.
message WorkspacePushRequest {
    ContextInfo context = 1;
    // Empty workspace_name resolves to the primary workspace.
    string workspace_name = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// WorkspacePushResponse is empty on success.
message WorkspacePushResponse {}

// ---------------------------------------------------------------------------
// Session operations
// ---------------------------------------------------------------------------

// DevboxExecRequest names the session and the command. No tenant field, no
// sandbox handle: the Devbox is addressed purely by the server-derived
// (tenant, session_id) pair.
message DevboxExecRequest {
    ContextInfo context = 1;

    // session_id is the agent-chosen opaque session identity shared with the
    // session-context store. Required, non-empty.
    string session_id = 2 [(buf.validate.field).string = { max_len: 1024 }];

    // argv is the command to run, exec-style (argv[0] is the binary). The
    // server does not shell-interpret it; a caller that wants a shell asks
    // for one explicitly (argv = ["sh", "-c", …]).
    repeated string argv = 3;

    // stdin is written to the process's standard input and closed. Empty
    // means an immediately-closed stdin, not an open pipe.
    bytes stdin = 4;
}

// DevboxExecResponse streams interleaved stdio and ends with the exit event.
// Exactly one exit event terminates a successful stream; a stream that ends
// without one was cut by transport or server failure and the caller must not
// assume the command completed.
message DevboxExecResponse {
    oneof payload {
        // stdout/stderr carry raw chunks in arrival order. Chunk boundaries
        // are transport artifacts, not line boundaries.
        bytes stdout = 1;
        bytes stderr = 2;
        DevboxExecExit exit = 3;
        HarnessError error = 4;
    }
}

// DevboxExecExit is the terminal event of a completed command.
message DevboxExecExit {
    int32 exit_code = 1;
}

// PutSessionContextRequest writes the session's context blob.
message PutSessionContextRequest {
    ContextInfo context = 1;

    // session_id — see DevboxExecRequest.session_id; the same identity.
    string session_id = 2 [(buf.validate.field).string = { max_len: 1024 }];

    // data is the opaque blob. The server enforces a size cap (~8 MB);
    // larger working state belongs in the Devbox, not here.
    bytes data = 3;

    // if_match carries the etag of the version this write is based on.
    // Empty string means "create": the write succeeds only if no blob exists
    // for this session yet. A non-empty etag succeeds only if it names the
    // current version. Either mismatch is rejected — a stale writer learns
    // it lost the race instead of clobbering the winner.
    string if_match = 4 [(buf.validate.field).string = { max_len: 4096 }];
}

message PutSessionContextResponse {
    HarnessError error = 1;

    // etag names the version this write produced; pass it as if_match on
    // the next write.
    string etag = 2;
}

message GetSessionContextRequest {
    ContextInfo context = 1;
    string session_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

message GetSessionContextResponse {
    HarnessError error = 1;

    // data is empty and etag "" when no blob exists for the session (a
    // fresh session is not an error).
    bytes data = 2;
    string etag = 3;
}

message DeleteSessionContextRequest {
    ContextInfo context = 1;
    string session_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// DeleteSessionContextResponse is empty on success; deleting a session that
// has no blob is a no-op, not an error.
message DeleteSessionContextResponse {
    HarnessError error = 1;
}

// ============================================================================
// Bank member inbox and jobs (ADR-0119)
// ============================================================================

// SubscribeInputRequest opens the input stream for the calling member.
message SubscribeInputRequest {
    // context identifies the calling member's run.
    ContextInfo context = 1;
}

// SubscribeInputResponse carries one input for the calling member.
message SubscribeInputResponse {
    // input is the next input, with its per-turn grant.
    gibson.job.v1.Input input = 1;
}

// PullJobRequest asks for the next queued job of the calling member's bank.
message PullJobRequest {
    // context identifies the calling member's run.
    ContextInfo context = 1;
}

// PullJobResponse carries the next queued job, or nothing.
message PullJobResponse {
    // job is the job the daemon assigned to the member. Unset when the queue
    // is empty.
    gibson.job.v1.Job job = 1;
    HarnessError error = 2;
}

// ReportJobStateRequest reports a job state change from the member.
message ReportJobStateRequest {
    // context identifies the calling member's run.
    ContextInfo context = 1;
    // job_id is the job. Required.
    string job_id = 2 [(buf.validate.field).string = { min_len: 1 }];
    // state is the new state: WORKING or WAITING. Required.
    gibson.job.v1.JobState state = 3 [(buf.validate.field).enum = { defined_only: true, in: [2, 3] }];
    // claude_session_id is the Claude Code session that holds the job.
    string claude_session_id = 4 [(buf.validate.field).string = { max_len: 1024 }];
}

// ReportJobStateResponse acknowledges the state change.
message ReportJobStateResponse {
    HarnessError error = 1;
}

// ReportDeliverableRequest records one deliverable the driver performed.
message ReportDeliverableRequest {
    // context identifies the calling member's run.
    ContextInfo context = 1;
    // job_id is the job. Required.
    string job_id = 2 [(buf.validate.field).string = { min_len: 1 }];
    // deliverable is what was done. Required.
    gibson.job.v1.Deliverable deliverable = 3 [(buf.validate.field).required = true];
}

// ReportDeliverableResponse acknowledges the deliverable.
message ReportDeliverableResponse {
    HarnessError error = 1;
}

// OpenJobRequest opens a job on a bank from a dispatched agent.
message OpenJobRequest {
    // context identifies the calling agent's run.
    ContextInfo context = 1;
    // bank_id is the bank to open the job on. Required.
    string bank_id = 2 [(buf.validate.field).string = { min_len: 1 }];
    // member_id pins the job to one member of that bank. Empty lets the
    // daemon pick a member with a free slot.
    string member_id = 3 [(buf.validate.field).string = { max_len: 1024 }];
    // spec is the structured input. Required.
    gibson.job.v1.JobSpec spec = 4 [(buf.validate.field).required = true];
}

// OpenJobResponse carries the opened job.
message OpenJobResponse {
    // job is the job as stored.
    gibson.job.v1.Job job = 1;
    HarnessError error = 2;
}

// SendInputRequest sends the next message to an open job from a dispatched
// agent.
message SendInputRequest {
    // context identifies the calling agent's run.
    ContextInfo context = 1;
    // job_id is the job. Required.
    string job_id = 2 [(buf.validate.field).string = { min_len: 1 }];
    // message is the text of the input. Required.
    string message = 3 [(buf.validate.field).string = { min_len: 1 }];
    // kind is what the input asks the member to do. Unspecified means
    // INPUT_KIND_TURN. A client never sends INPUT_KIND_WRAP_UP.
    gibson.job.v1.InputKind kind = 4 [(buf.validate.field).enum = { defined_only: true, not_in: [3] }];
}

// SendInputResponse carries the input as the daemon recorded it.
message SendInputResponse {
    // input is the input without its grant.
    gibson.job.v1.Input input = 1;
    HarnessError error = 2;
}

// CloseJobRequest closes a job from a dispatched agent.
message CloseJobRequest {
    // context identifies the calling agent's run.
    ContextInfo context = 1;
    // job_id is the job. Required.
    string job_id = 2 [(buf.validate.field).string = { min_len: 1 }];
    // verdict is the outcome. Required.
    gibson.job.v1.JobVerdict verdict = 3 [(buf.validate.field).enum = { defined_only: true, not_in: [0] }];
    // score is the scorer's score, from 0.0 to 1.0.
    double score = 4 [(buf.validate.field).double = { gte: 0.0, lte: 1.0 }];
}

// CloseJobResponse carries the job after the close was recorded.
message CloseJobResponse {
    // job is the job as stored.
    gibson.job.v1.Job job = 1;
    HarnessError error = 2;
}
