message QueryPluginRequest {
    ContextInfo context = 1;
    string name = 2 [(buf.validate.field).string = { max_len: 1024 }];
    string method = 3 [(buf.validate.field).string = { max_len: 4096 }];
    map<string, gibson.common.v1.TypedValue> params = 4;
}

message QueryPluginResponse {
    gibson.common.v1.TypedValue result = 1;
    HarnessError error = 2;
}

message ListPluginsRequest {
    ContextInfo context = 1;
}

message ListPluginsResponse {
    repeated HarnessPluginDescriptor plugins = 1;
    HarnessError error = 2;
}

message HarnessPluginDescriptor {
    string name = 1;
    string description = 2;
    string version = 3;
    repeated string methods = 4;
}

// ============================================================================
// Agent Operations
// ============================================================================

// DelegateToAgentRequest dispatches a task to another agent. The target
// selector says WHERE the task runs. Absent means an ephemeral launch, which
// is the behavior every caller had before banks existed.
message DelegateToAgentRequest {
    ContextInfo context = 1;
    string name = 2 [(buf.validate.field).string = { max_len: 1024 }];
    gibson.types.v1.Task task = 3;

    // target says where the task runs. Leave it unset for an ephemeral
    // launch.
    oneof target {
        // ephemeral launches a new sandbox for this task and tears it down
        // when the task ends. Setting it to true is the same as leaving the
        // oneof unset; it lets a caller say so out loud.
        bool ephemeral = 10;
        // bank_id opens a new job on that bank. A member with a free slot
        // takes it, or the bank queues it, per the bank spill policy.
        string bank_id = 11 [(buf.validate.field).string = { max_len: 1024 }];
        // job_id sends the task as the next input to a job that is already
        // open, so the agent keeps its conversation and its worktrees.
        string job_id = 12 [(buf.validate.field).string = { max_len: 1024 }];
    }
}

// DelegateToAgentResponse carries the delegated task's result, and the job
// the task ran as when the target was a bank or a job.
message DelegateToAgentResponse {
    gibson.types.v1.Result result = 1;
    HarnessError error = 2;
    // job_id names the job the task ran as. Empty for an ephemeral launch.
    string job_id = 3;
    // member_id names the bank member that ran the job. Empty for an
    // ephemeral launch.
    string member_id = 4;
}

message ListAgentsRequest {
    ContextInfo context = 1;
}

message ListAgentsResponse {
    repeated HarnessAgentDescriptor agents = 1;
    HarnessError error = 2;
}

message HarnessAgentDescriptor {
    string name = 1;
    string version = 2;
    string description = 3;
    repeated string capabilities = 4;
    repeated string target_types = 5;
    repeated string technique_types = 6;
}

// ============================================================================
// Finding Operations
// ============================================================================

message SubmitFindingRequest {
    ContextInfo context = 1;
    gibson.types.v1.Finding finding = 2;

    // idempotency_key makes a retry safe (ADR-0028). A second request with the
    // same key returns the result of the first request and does the work one
    // time. An empty key turns the protection off for the call.
    string idempotency_key = 3 [(buf.validate.field).string = { max_len: 128 }];
}

message SubmitFindingResponse {
    HarnessError error = 1;
}

// FindingFilter represents filtering criteria for findings
message FindingFilter {
    string mission_id = 1;
    string agent_name = 2;
    gibson.types.v1.FindingSeverity severity = 3;
    gibson.types.v1.FindingStatus status = 4;
    repeated string tags = 5;
}

// ============================================================================
// Knowledge Operations
// ============================================================================
//
// These mirror the ComponentService knowledge reads, with one deliberate
// difference: they carry ContextInfo rather than a bare work_id. ContextInfo is
// this service's scoping convention and it also names mission_run_id, which is
// what mission-scoped GraphRAG reads need — a work_id alone cannot express it.
//
// The *_json payloads keep the ComponentService encodings verbatim so both
// services decode with the same code on either side of the wire. They are JSON,
// not proto, because that is what the existing graphrag querier returns; making
// them typed here and untyped there would be a second representation of the
// same data, which is how the two drift.

// QueryNodesRequest searches the knowledge graph with hybrid vector + graph scoring.
message QueryNodesRequest {
    ContextInfo context = 1;
    gibson.graphrag.v1.GraphQuery query = 2;
}

// QueryNodesResponse carries knowledge graph query results.
message QueryNodesResponse {
    repeated gibson.graphrag.v1.QueryResult results = 1;
    HarnessError error = 2;
}

// FindSimilarAttacksRequest searches for attack patterns similar to the given content.
message FindSimilarAttacksRequest {
    ContextInfo context = 1;
    string content = 2 [(buf.validate.field).string = { max_len: 16777216 }];
    int32 top_k = 3;
}

// FindSimilarAttacksResponse carries matching attack patterns.
message FindSimilarAttacksResponse {
    repeated gibson.graphrag.v1.AttackPattern results = 1;
    HarnessError error = 2;
}

// GetAttackChainsRequest requests multi-hop attack paths from a technique.
message GetAttackChainsRequest {
    ContextInfo context = 1;
    string technique_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
    int32 max_depth = 3;
}

// GetAttackChainsResponse carries attack chain results.
message GetAttackChainsResponse {
    repeated gibson.graphrag.v1.AttackChain results = 1;
    HarnessError error = 2;
}

// FindSimilarFindingsRequest searches for findings similar to the given one.
message FindSimilarFindingsRequest {
    ContextInfo context = 1;
    string finding_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
    int32 top_k = 3;
}

// FindSimilarFindingsResponse carries matching findings.
message FindSimilarFindingsResponse {
    repeated gibson.graphrag.v1.FindingNode results = 1;
    HarnessError error = 2;
}

// GetRelatedFindingsRequest requests findings related via graph relationships.
message GetRelatedFindingsRequest {
    ContextInfo context = 1;
    string finding_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// GetRelatedFindingsResponse carries related findings.
message GetRelatedFindingsResponse {
    repeated gibson.graphrag.v1.FindingNode results = 1;
    HarnessError error = 2;
}

// GetFindingsRequest queries previously submitted findings.
message GetFindingsRequest {
    ContextInfo context = 1;
    // filter is typed for the same reason the responses are: a JSON blob whose
    // schema lives in a comment is a contract nothing checks.
    FindingFilter filter = 2;
}

// GetFindingsResponse carries matching findings.
message GetFindingsResponse {
    repeated gibson.types.v1.Finding findings = 1;
    HarnessError error = 2;
}

// ApplicationFindingsRequest asks for one Application's Findings with the
// lifecycle context that decides how much each one matters.
//
// It carries NO tenant field. The tenant is derived from the call context, so
// naming another tenant's graph is unrepresentable rather than rejected — the
// same rule every other read on this service follows.
message ApplicationFindingsRequest {
    ContextInfo context = 1;
    // application is the Application's key. Required: this read is scoped to
    // one Application by construction, and an empty key would silently widen
    // the traversal to the whole tenant graph.
    string application = 2 [(buf.validate.field).string = { max_len: 4096 }];
    // statuses filters by lifecycle status (open, fixing, fixed, verified).
    // Empty means every status.
    repeated string statuses = 3;
    // limit bounds one read. 0 means the server default; the server caps it,
    // so a caller cannot walk an entire tenant graph in one call.
    int32 limit = 4;
}

// ApplicationFinding is one Finding of an Application, with the lifecycle
// context that decides how much it matters.
message ApplicationFinding {
    // finding_id is the Finding's brain_id — the same identity every other
    // surface uses, so an agent can write back to the node it read.
    string finding_id = 1;
    // status is the Finding's lifecycle status: open, fixing, fixed, verified.
    string status = 2;
    // severity is the severity recorded when the Finding was raised.
    string severity = 3;
    // vulnerability_id identifies the weakness this Finding instantiates (a
    // CVE, a GHSA, or a platform id). Empty when the Finding names no public
    // identifier — a source finding, say — which is a fact about the Finding,
    // not a failure of the read.
    string vulnerability_id = 4;
    // place_label and place_key are what the Finding affects: a Package in an
    // image, a Repository, or a Service on a host.
    string place_label = 5;
    string place_key = 6;
    // reachable reports that the affected place is inside an Image that a
    // Deployment of this Application runs. False means nothing this
    // Application deploys contains it.
    //
    // It is derived from the presence of that route, never from a stored
    // property: a property would go stale the moment a deployment rolls, and a
    // stale "not reachable" is a silent false negative — a triage rule reads it
    // as "nothing runs this" and ranks a live finding last.
    bool reachable = 7;
    // exposed reports that the Deployment which reaches it also exposes a Host.
    // Only ever true when reachable is.
    bool exposed = 8;
    // deployment_key and image_key name the route that made it reachable, so an
    // agent can say WHY rather than assert it.
    string deployment_key = 9;
    string image_key = 10;
    // priority, priority_rule and priority_reason are what a previous triage
    // pass decided about this Finding, written back by the agent and returned
    // here so the next pass can read its own history.
    //
    // Two behaviors are dark while they are empty. A triage rule that keeps
    // the previous priority when a scoring feed is unavailable — so an outage
    // never re-ranks a Finding on severity alone — has nothing to keep. And a
    // pass that explains only what changed sees every decision as a change, so
    // model cost scales with the size of the backlog rather than with what
    // actually happened.
    //
    // Empty means NO PASS HAS DECIDED YET. That is a fact about the Finding,
    // not a failure of the read, and a reader must never take it for
    // "unimportant". The three are written by different steps — a rule table
    // decides the priority, a model writes the reason — so losing the reason
    // must not take the decision with it: an empty priority_reason beside a
    // populated priority is a model that went quiet, not a Finding nobody
    // ranked.
    string priority = 11;
    string priority_rule = 12;
    string priority_reason = 13;
}

// ApplicationFindingsResponse carries the Application's Findings.
//
// Unavailability is reported in error, NEVER as an empty list with no error:
// an empty list means the Application genuinely has no matching Finding, and
// conflating the two is what makes an unanswerable question look like good news.
message ApplicationFindingsResponse {
    repeated ApplicationFinding findings = 1;
    HarnessError error = 2;
}

// RunScope selects which mission runs GetRunFindings reads.
enum RunScope {
    RUN_SCOPE_UNSPECIFIED = 0;
    // RUN_SCOPE_PREVIOUS reads the run immediately before the current one.
    RUN_SCOPE_PREVIOUS = 1;
    // RUN_SCOPE_ALL reads every run of this mission.
    RUN_SCOPE_ALL = 2;
}

// GetRunFindingsRequest queries findings scoped to mission runs.
//
// One RPC with a scope, not one RPC per scope. gibson's harness carried
// GetPreviousRunFindings and GetAllRunFindings as separate methods; the scope is
// data, and modelling it as data is what lets a caller pass it through.
message GetRunFindingsRequest {
    ContextInfo context = 1;
    RunScope scope = 2 [(buf.validate.field).enum = { defined_only: true }];
    FindingFilter filter = 3;
}

// GetRunFindingsResponse carries findings from the selected runs.
message GetRunFindingsResponse {
    repeated gibson.types.v1.Finding findings = 1;
    HarnessError error = 2;
}

// GetMissionRunHistoryRequest asks for every run of the caller's mission.
message GetMissionRunHistoryRequest {
    ContextInfo context = 1;
}

// GetMissionRunHistoryResponse carries the run summaries.
message GetMissionRunHistoryResponse {
    repeated gibson.types.v1.MissionRunSummary runs = 1;
    HarnessError error = 2;
}

// ============================================================================
// Memory Operations
// ============================================================================

// MemoryTier specifies which memory tier to use for an operation.
enum MemoryTier {
    MEMORY_TIER_UNSPECIFIED = 0;  // Default to WORKING for backward compatibility
    MEMORY_TIER_WORKING = 1;      // Ephemeral in-memory
    MEMORY_TIER_MISSION = 2;      // Persistent per-mission with FTS
    MEMORY_TIER_LONG_TERM = 3;    // Vector-based semantic storage
}

// ============================================================================
// Mission Memory Operations
// ============================================================================

message MissionMemoryResult {
    string key = 1;
    gibson.common.v1.TypedValue value = 2;
    map<string, gibson.common.v1.TypedValue> metadata = 3;
    double score = 4;
    string created_at = 5;
    string updated_at = 6;
}

message MissionMemoryItem {
    string key = 1;
    gibson.common.v1.TypedValue value = 2;
    map<string, gibson.common.v1.TypedValue> metadata = 3;
    string created_at = 4;
    string updated_at = 5;
}

message HistoricalValueItem {
    gibson.common.v1.TypedValue value = 1;
    int32 run_number = 2;
    string mission_id = 3;
    string stored_at = 4;
}

// ============================================================================
// Long-Term Memory Operations
// ============================================================================

message LongTermMemoryResult {
    string id = 1;
    string content = 2;
    map<string, gibson.common.v1.TypedValue> metadata = 3;
    double score = 4;
    string created_at = 5;
}

// ============================================================================
// GraphRAG Query Operations
// ============================================================================

message GraphRAGResult {
    GraphNode node = 1;
    double score = 2;
    double vector_score = 3;
    double graph_score = 4;
    repeated string path = 5;
    int32 distance = 6;
}

message GraphNode {
    string id = 1;
    string type = 2;
    map<string, gibson.common.v1.TypedValue> properties = 3;
    string content = 4;
    string mission_id = 5;
    string agent_name = 6;
    int64 created_at = 7;  // Unix timestamp
    int64 updated_at = 8;  // Unix timestamp
}

message AttackPattern {
    string technique_id = 1;
    string name = 2;
    string description = 3;
    repeated string tactics = 4;
    repeated string platforms = 5;
    double similarity = 6;
}

message FindingNode {
    string id = 1;
    string title = 2;
    string description = 3;
    string severity = 4;
    string category = 5;
    double confidence = 6;
    double similarity = 7;
}

message AttackChain {
    string id = 1;
    string name = 2;
    string severity = 3;
    repeated AttackStep steps = 4;
}

message AttackStep {
    int32 order = 1;
    string technique_id = 2;
    string node_id = 3;
    string description = 4;
    double confidence = 5;
}

// ============================================================================
// GraphRAG Storage Operations
// ============================================================================

message Relationship {
    string from_id = 1;
    string to_id = 2;
    string type = 3;
    map<string, gibson.common.v1.TypedValue> properties = 4;
    bool bidirectional = 5;
}

message TraversalOptions {
    int32 max_depth = 1;
    repeated string relationship_types = 2;
    repeated string node_types = 3;
    string direction = 4;  // outgoing, incoming, both
}

message TraversalResult {
    GraphNode node = 1;
    repeated string path = 2;
    int32 distance = 3;
}

// ============================================================================
// Proto-Canonical GraphRAG Operations (uses graphragpb types)
// ============================================================================

// ObserveRequest carries a typed observation (ADR-0107). Scope is NOT carried —
// the daemon derives it from the mission context.
message ObserveRequest {
    ContextInfo context = 1;
    oneof observation {
        HostObservation host = 2;
        DomainObservation domain = 3;
        SubdomainObservation subdomain = 4;
        CredentialObservation credential = 5;
        AccountObservation account = 6;
        MemoryObservation memory = 7;
        LifecycleEntityObservation lifecycle_entity = 8;
        HypothesisObservation hypothesis = 9;
        ReasoningStepObservation reasoning_step = 10;
        AnalysisObservation analysis = 11;
    }
}

// LifecycleEntityObservation reports a sighting of a typed application-lifecycle
// entity: an Application, Repository, Image, Package, Deployment, Vulnerability,
// MergeRequest, Pipeline or Control, and the edges it was seen to have.
//
// Admission is the Taxonomy's decision, not this message's. The daemon puts
// label and every edge type to the global Taxonomy; an admitted shape becomes a
// typed node, and one the Taxonomy does not admit is neither rejected nor lost —
// it lands as an Observation with its residue preserved (ADR-0112). So an agent
// can always write, and can never invent schema.
//
// This is a SIGHTING, not a graph write. The agent reports what it saw; the
// brain resolves identity and the projector materialises it. An agent naming an
// existing node's identity enriches that node rather than creating a second one.
message LifecycleEntityObservation {
    // label is the Taxonomy label, e.g. "Package". A label outside the Taxonomy
    // lands as an Observation rather than being refused.
    string label = 1;
    // id_properties identify the entity. One property is the identity; several
    // are folded into a composite key in sorted order, so the same entity
    // observed twice resolves to the same node whatever order the map came in.
    // An entity with no identity property records nothing — there would be no
    // stable node to project.
    map<string, string> id_properties = 2;
    // properties are the entity's non-identifying facts. A later sighting's
    // properties take precedence over an earlier one's; a sighting that omits a
    // property never erases what an earlier one established.
    map<string, string> properties = 3;
    // edges are the outgoing relationships seen in this sighting. Both ends and
    // the relationship type must be admitted by the Taxonomy, or the edge is
    // skipped while the entity itself still lands.
    repeated LifecycleEntityEdge edges = 4;
}

// LifecycleEntityEdge is one outgoing relationship to another typed entity,
// named by its label and identity rather than by a node id — the emitter does
// not know node ids, and must not be able to guess them.
message LifecycleEntityEdge {
    // type is a Taxonomy relationship type, e.g. "CONTAINS".
    string type = 1;
    // target_label is the Taxonomy label of the other end.
    string target_label = 2;
    // target_id_properties identify the other end, folded the same way as
    // id_properties above.
    map<string, string> target_id_properties = 3;
}

// HostObservation reports a host seen at address with optional strong identity
// signals and the ports observed open in this sighting.
message HostObservation {
    string address = 1;
    string ssh_host_key = 2;
    string cloud_id = 3;
    repeated PortObservation ports = 4;
}

// PortObservation is an observed open port and its optional service detail.
message PortObservation {
    int32 number = 1;
    string protocol = 2;
    string service = 3;
    string product = 4;
    string version = 5;
    repeated EndpointObservation endpoints = 6;
    repeated TechnologyObservation technologies = 7;
    CertificateObservation certificate = 8;
}

// EndpointObservation is a path observed on a service.
message EndpointObservation {
    string path = 1;
    int32 status = 2;
}

// TechnologyObservation is a technology fingerprinted on a service.
message TechnologyObservation {
    string name = 1;
    string version = 2;
}

// CertificateObservation is a TLS certificate served on a port (identity: fingerprint).
message CertificateObservation {
    string fingerprint = 1;
    string subject = 2;
    string issuer = 3;
    string not_after = 4;
}

// DomainObservation reports a registrable domain seen in scope.
message DomainObservation {
    string name = 1;
}

// SubdomainObservation reports an FQDN, its parent domain, and resolved addresses.
message SubdomainObservation {
    string fqdn = 1;
    string domain = 2;
    repeated string addresses = 3;
}

// CredentialObservation reports a discovered credential (identity: secret hash).
message CredentialObservation {
    string secret_hash = 1;
    string username = 2;
    string kind = 3;
}

// AccountObservation reports a discovered account/principal (identity: identifier).
message AccountObservation {
    string identifier = 1;
    string kind = 2;
}

// MemoryObservation reports a fact the agent wants to keep across runs, in the
// agent's own words. It is the memory write for coding agents: a memory is
// a World observation, not a store of its own.
//
// Identity is per sighting: the Timeline event id, like every observation. The
// Taxonomy gate lands it as an `Observation` node with shape "Memory" until
// Sensing promotes the shape. Scope and tenant are server-side, same as the
// other variants. There is no field for either.
message MemoryObservation {
    // text is the fact.
    string text = 1;
    // kind is a short category, for example "convention", "decision", "layout".
    string kind = 2;
    // tags help recall. Free-form, lower-case.
    repeated string tags = 3;
    // source_ref names where the fact came from: a path, a URL, or a work id.
    string source_ref = 4;
}

// HypothesisObservation reports an agent's own reasoning: a proposed, unproven
// claim, not a sighting (ADR-0121). It is attributed to the proposing agent and
// carries a confidence; it stays unverified until it settles (the betting /
// settlement slices, ADR-0122 / ADR-0123). This keeps the agent write surface
// emit-only — one more observation kind, never a raw graph write (ADR-0107).
message HypothesisObservation {
    // proposer identifies the agent making the claim.
    string proposer = 1;
    // confidence is the proposer's calibrated confidence in the claim.
    double confidence = 2 [(buf.validate.field).double = { gte: 0.0, lte: 1.0 }];
    // claim states the hypothesis in a form the brain can later settle, e.g.
    // "port 6443 on this host is unauthenticated".
    string claim = 3;
    // references names the entities the claim is about, by label and identity —
    // the emitter does not know node ids, and must not be able to guess them.
    repeated ReferencedEntity references = 4;
    // technique names the technique this hypothesis exercises. Reputation
    // keys on technique x environment (ADR-0122, gibson#333/#284), so this
    // must ride on the Hypothesis the same way it already rides on Bet.
    // Optional and additive: empty means the hypothesis carries no technique
    // signal (resolves to the neutral prior), same as before this field
    // existed.
    string technique = 5;
    // hypothesis_id is the agent-chosen identifier for this claim. The SAME
    // value the agent later names as Bet.hypothesis_id when it stakes on
    // this claim, and that a settlement path (Engine.SettleBetByHITL,
    // gibson#280) records against — the one join key across Hypothesis, Bet
    // and BetSettlement (gibson#339). Optional: empty preserves the
    // pre-existing behavior of a Hypothesis with no bettable identity (it
    // still folds as a claim, ADR-0121, it just cannot be staked on or
    // settled by id).
    string hypothesis_id = 6;
}

// ReferencedEntity names an entity a Hypothesis is about, by its Taxonomy label
// and identity properties rather than a node id (same scheme as
// LifecycleEntityEdge's target).
message ReferencedEntity {
    // label is the Taxonomy label, e.g. "Host" / "Package".
    string label = 1;
    // id_properties identify the entity, folded the same way as
    // LifecycleEntityObservation.id_properties.
    map<string, string> id_properties = 2;
}

// ReasoningStepObservation reports one step of an agent's own structured,
// multi-step reasoning over graph state (sdk#73): what it inferred, and the
// entities its inference is about. It builds on the planning package's step
// model — step_index is typically the mission's current step
// (PlanningContext.CurrentStepIndex) — so a reasoning trace aligns with the
// mission's own plan. Like every Observation, this is an emit: the daemon
// folds it onto the Timeline (flight recorder), so a completed multi-step
// trace is inspectable afterward by plan_id, in step order.
message ReasoningStepObservation {
    // agent identifies the agent doing the reasoning.
    string agent = 1;
    // plan_id groups every step of one reasoning trace. Agent-assigned: the
    // SDK does not read node ids back, so a plan does not get one from the
    // daemon.
    string plan_id = 2;
    // step_index orders steps within plan_id.
    int32 step_index = 3;
    // step states what the agent reasoned or decided at this step.
    string step = 4;
    // references names the entities this step's reasoning is about, by label
    // and identity (the same scheme HypothesisObservation.references uses).
    repeated ReferencedEntity references = 5;
}

// AnalysisObservation reports a typed analysis artifact (sdk#74): a
// conclusion an agent draws FROM evidence already on the graph, with the
// confidence it holds and the evidence it used — the bridge between raw
// findings and reportable output. Unlike a Hypothesis (an unproven,
// forward-looking claim awaiting settlement, ADR-0121), an Analysis is
// backward-looking: it synthesizes what is already known rather than
// proposing something new to test. Like every Observation, this feeds
// hypotheses and findings as a typed artifact, never as free text, and it is
// an emit: the daemon folds it onto the Timeline (ADR-0107).
message AnalysisObservation {
    // agent identifies the agent producing the analysis.
    string agent = 1;
    // conclusion states the typed conclusion in a form the brain can fold
    // into a Finding or a Hypothesis, not free text.
    string conclusion = 2;
    // confidence is the agent's calibrated confidence in the conclusion.
    double confidence = 3 [(buf.validate.field).double = { gte: 0.0, lte: 1.0 }];
    // evidence names the entities on the graph this conclusion is based on,
    // by label and identity (the same scheme HypothesisObservation.references
    // uses) — the link from the conclusion back to the evidence it used.
    repeated ReferencedEntity evidence = 4;
}

// ObserveResponse acknowledges an observation.
message ObserveResponse {
    HarnessError error = 1;
}

// PlaceBetRequest carries a calibrated stake on a Hypothesis (ADR-0122).
message PlaceBetRequest {
    ContextInfo context = 1;
    Bet bet = 2;
}

// Bet is an agent's calibrated stake on a Hypothesis: a stake that later
// settles, not a bare confidence number (ADR-0122). Reputation attaches to
// technique × environment, never to an agent, so the technique the bet
// exercises rides on the bet itself.
message Bet {
    // hypothesis_id names the Hypothesis this bet is on.
    string hypothesis_id = 1;
    // staking_agent identifies the agent placing the bet.
    string staking_agent = 2;
    // confidence is the staked calibrated confidence.
    double confidence = 3 [(buf.validate.field).double = { gte: 0.0, lte: 1.0 }];
    // technique names the technique this bet exercises. The reputation key is
    // technique × environment, so this must ride on the bet.
    string technique = 4;
}

// PlaceBetResponse acknowledges a bet placement.
message PlaceBetResponse {
    HarnessError error = 1;
}

// ============================================================================
// Proof settlement — ADR-0131 (agent-triggered, system-verified) and
// ADR-0132 (the destructive-proof gate sits before the action)
// ============================================================================

// SubmitProofRequest carries the raw evidence an agent captured for a
// Hypothesis it staked a Bet on. The agent supplies raw, uninterpreted tool
// output — never a verdict (ADR-0131) — and a deterministic,
// typed predicate on the daemon decides whether the Bet settles.
message SubmitProofRequest {
    ContextInfo context = 1;
    // hypothesis_id names the Hypothesis this proof settles. The same value
    // the agent named on the HypothesisObservation and on the Bet it staked —
    // the one join key across Hypothesis, Bet and BetSettlement.
    string hypothesis_id = 2 [(buf.validate.field).string = { min_len: 1 }];
    // technique names the technique this proof exercises, the same value
    // carried on the Bet (reputation keys on technique x environment,
    // ADR-0122).
    string technique = 3 [(buf.validate.field).string = { max_len: 4096 }];
    // predicate_name names the enabled pack's CEL predicate the daemon
    // evaluates against evidence to decide settlement. The agent names a
    // predicate; it never evaluates one.
    string predicate_name = 4 [(buf.validate.field).string = { min_len: 1 }];
    // evidence is the raw tool output the predicate evaluates. It is never a
    // verdict or an interpretation of what the evidence shows.
    repeated gibson.types.v1.Evidence evidence = 5;
    // Field 6 (destructive) let the agent state that its own proof was
    // destructive. The daemon does not read a statement from the agent. The
    // enabled Domain Pack states which predicates are non-destructive, and a
    // predicate that the pack does not name is destructive (ADR-0132).
    //
    // The field number and name are reserved so they are never reused.
    reserved 6;
    reserved "destructive";

    // tool_call_ids names the tool calls whose recorded results are the
    // evidence of this proof. Each id is the ContextInfo.tool_execution_id of
    // a tool call that the daemon recorded in this mission. The daemon reads
    // the recorded result of each call and evaluates the predicate on it.
    // Evidence in the evidence field that no tool call id backs is typed by
    // the agent, and the daemon sends such a proof to human review.
    repeated string tool_call_ids = 7;

    // idempotency_key makes a retry safe (ADR-0028). A second request with the
    // same key returns the result of the first request and does the work one
    // time. An empty key turns the protection off for the call.
    string idempotency_key = 8 [(buf.validate.field).string = { max_len: 128 }];
}

// SettlementOutcome reports what SubmitProof did with the submitted proof.
enum SettlementOutcome {
    SETTLEMENT_OUTCOME_UNSPECIFIED = 0;
    // SETTLEMENT_OUTCOME_SETTLED_TRUE means the predicate fired against the
    // submitted evidence and the Bet settled true.
    SETTLEMENT_OUTCOME_SETTLED_TRUE = 1;
    // SETTLEMENT_OUTCOME_NOT_SETTLED means the predicate did not fire. The
    // Bet stays unsettled.
    SETTLEMENT_OUTCOME_NOT_SETTLED = 2;
    // SETTLEMENT_OUTCOME_PENDING_AUTHORIZATION means the proof was destructive
    // and settlement is deferred until the daemon reads back an approved
    // authorization decision for this hypothesis_id (ADR-0132). SubmitProof
    // never blocks on that decision.
    SETTLEMENT_OUTCOME_PENDING_AUTHORIZATION = 3;
    // SETTLEMENT_OUTCOME_PENDING_REVIEW means the proof carried only evidence
    // that the agent typed, with no recorded tool call behind it, so a human
    // decides. SubmitProof never blocks on that decision.
    SETTLEMENT_OUTCOME_PENDING_REVIEW = 4;
}

// SubmitProofResponse reports the settlement outcome. SubmitProof never
// blocks on a human decision (ADR-0132): a destructive proof
// returns SETTLEMENT_OUTCOME_PENDING_AUTHORIZATION immediately rather than
// waiting for the pending authorization to resolve.
message SubmitProofResponse {
    string hypothesis_id = 1;
    SettlementOutcome outcome = 2;
    HarnessError error = 3;
}

// Reversibility states whether a destructive action can be undone once it
// runs.
enum Reversibility {
    REVERSIBILITY_UNSPECIFIED = 0;
    REVERSIBILITY_REVERSIBLE = 1;
    REVERSIBILITY_IRREVERSIBLE = 2;
}

// RequestDestructiveAuthorizationRequest asks a human to approve an
// irreversible demonstration before the agent performs it (ADR-0132). It
// carries what a human reviewer needs to decide (ADR-0132): what
// the action would do, its blast radius, its reversibility, and the
// predicate it would satisfy.
message RequestDestructiveAuthorizationRequest {
    ContextInfo context = 1;
    // hypothesis_id names the Hypothesis the destructive demonstration would
    // prove, and the join key a later SubmitProof settles by.
    string hypothesis_id = 2 [(buf.validate.field).string = { min_len: 1 }];
    // technique names the technique the demonstration exercises.
    string technique = 3 [(buf.validate.field).string = { max_len: 4096 }];
    // predicate_name names the CEL predicate the demonstration would
    // satisfy — the same value a subsequent SubmitProof names.
    string predicate_name = 4 [(buf.validate.field).string = { min_len: 1 }];
    // action_description states, in plain words, what the demonstration
    // would do. Shown to the human reviewer verbatim.
    string action_description = 5 [(buf.validate.field).string = { min_len: 1 }];
    // blast_radius states, in plain words, what the action would reach — one
    // host, one tenant's data, a shared production resource. Empty means the
    // caller has no signal to report; it is not a claim of zero blast radius.
    string blast_radius = 6 [(buf.validate.field).string = { max_len: 4096 }];
    // reversibility states whether the action can be undone after it runs.
    Reversibility reversibility = 7 [(buf.validate.field).enum = { defined_only: true }];
}

// RequestDestructiveAuthorizationResponse returns immediately: the fleet
// keeps working while the human decision is pending (ADR-0132).
message RequestDestructiveAuthorizationResponse {
    // authorization_request_id names the pending request. The agent reads
    // the decision back before it performs the destructive act, then names
    // this same hypothesis_id on the eventual SubmitProof.
    string authorization_request_id = 1;
    HarnessError error = 2;
}

// ============================================================================
// WorldView — the agent's read of the World (ADR-0112)
// ============================================================================

// WorldViewRequest asks for the caller's slice of the tenant World.
//
// There is deliberately no tenant field and no scope field. The daemon reads both
// off the mission record it created, reached through the harness registered for
// (mission_id, agent_name); context is an address that selects which harness to
// consult, never an authority over what the slice contains. An agent therefore
// cannot express "another tenant's World" or "a wider scope" at all.
message WorldViewRequest {
    ContextInfo context = 1;

    // focus narrows the response to entities the caller was already shown, by
    // their handles, and returns those at full detail instead of the summary
    // level the unfocused slice carries. A handle that was not issued to this
    // caller is refused — focus can never widen a slice, only zoom into one.
    repeated string focus = 2;
}

// WorldViewResponse carries the projected slice.
message WorldViewResponse {
    HarnessError error = 1;
    repeated WorldEntity entities = 2;

    // truncated is true when the slice exceeded the projection cap and entities
    // were dropped. The cap is a server-side budget, not something the caller can
    // raise; a truncated slice is still a valid one.
    bool truncated = 3;
}

// WorldEntityKind names what an entity in the slice is.
enum WorldEntityKind {
    WORLD_ENTITY_KIND_UNSPECIFIED = 0;
    WORLD_ENTITY_KIND_HOST = 1;
    WORLD_ENTITY_KIND_DOMAIN = 2;
    WORLD_ENTITY_KIND_SUBDOMAIN = 3;
    WORLD_ENTITY_KIND_CREDENTIAL = 4;
    WORLD_ENTITY_KIND_ACCOUNT = 5;
    WORLD_ENTITY_KIND_FINDING = 6;
}

// WorldEntity is one entity in the slice.
message WorldEntity {
    // handle is the ONLY name the agent has for this entity: an opaque,
    // server-minted, non-constructible reference, valid within the slice it was
    // issued to and nowhere else. It carries no brain id an agent could iterate,
    // so enumerating past the slice boundary is unrepresentable (ADR-0112).
    //
    // A handle stays stable across re-projections of the same slice: the entity
    // it names does not change, so refreshing the view never invalidates a
    // reference the agent is holding.
    string handle = 1;

    WorldEntityKind kind = 2;

    // label is the entity's coordinate as observed — an address, an FQDN, a
    // finding title. Human- and LLM-readable; not a reference (only handle is).
    string label = 3;

    // attributes is the projected detail, level-of-detail summarized for the
    // unfocused slice and complete for a focused one. Keys are server-chosen.
    map<string, string> attributes = 4;
}

// ============================================================================
// Planning Operations
// ============================================================================

message GetPlanContextRequest {
    ContextInfo context = 1;
}

message GetPlanContextResponse {
    PlanContext plan_context = 1;
    HarnessError error = 2;
}

message PlanContext {
    int32 current_step_index = 1;
    int32 total_steps = 2;
    repeated string remaining_steps = 3;
    int32 step_budget = 4;
    int32 mission_budget_remaining = 5;
}

message ReportStepHintsRequest {
    ContextInfo context = 1;
    StepHints hints = 2;
}

message ReportStepHintsResponse {
    HarnessError error = 1;
}

message StepHints {
    double confidence = 1;
    repeated string suggested_next = 2;
    string replan_reason = 3;
    repeated string key_findings = 4;
}

// ============================================================================
// Distributed Tracing Operations
// ============================================================================

// SpanKind represents the role of a span in a distributed trace.
enum SpanKind {
    SPAN_KIND_UNSPECIFIED = 0;
    SPAN_KIND_INTERNAL = 1;
    SPAN_KIND_SERVER = 2;
    SPAN_KIND_CLIENT = 3;
    SPAN_KIND_PRODUCER = 4;
    SPAN_KIND_CONSUMER = 5;
}

// StatusCode represents the status of a span.
enum StatusCode {
    STATUS_CODE_UNSPECIFIED = 0;
    STATUS_CODE_OK = 1;
    STATUS_CODE_ERROR = 2;
}

// AnyValue represents a dynamically typed value used in attributes.
message AnyValue {
    oneof value {
        string string_value = 1;
        bool bool_value = 2;
        int64 int_value = 3;
        double double_value = 4;
        bytes bytes_value = 5;
    }
}

// KeyValue represents a key-value pair used in span attributes.
message KeyValue {
    string key = 1;
    AnyValue value = 2;
}

// SpanEvent represents a single event within a span.
message SpanEvent {
    string name = 1;
    int64 time_unix_nano = 2;
    repeated KeyValue attributes = 3;
}

// Span represents a single span in a distributed trace.
message Span {
    string trace_id = 1;
    string span_id = 2;
    string parent_span_id = 3;
    int64 start_time_unix_nano = 4;
    int64 end_time_unix_nano = 5;
    string name = 6;
    SpanKind kind = 7;
    StatusCode status_code = 8;
    string status_message = 9;
    repeated KeyValue attributes = 10;
    repeated SpanEvent events = 11;
}

message RecordSpanRequest {
    ContextInfo context = 1;
    Span span = 2;
}

message RecordSpanResponse {
    HarnessError error = 1;
