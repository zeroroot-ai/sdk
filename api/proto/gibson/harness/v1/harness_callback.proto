    Credential credential = 1;
    HarnessError error = 2;
}

message Credential {
    string name = 1;
    CredentialType type = 2;
    oneof secret_data {
        string api_key = 3;           // For API_KEY type
        string bearer_token = 4;      // For BEARER type
        BasicAuth basic = 5;          // For BASIC type
        OAuthCredential oauth = 6;    // For OAUTH type
        string custom_secret = 7;     // For CUSTOM type
