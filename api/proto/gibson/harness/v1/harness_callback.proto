syntax = "proto3";
package gibson.harness.v1;
option go_package = "github.com/zeroroot-ai/sdk/api/gen/gibson/harness/v1;harnesspb";
option java_multiple_files = true;
option csharp_namespace = "Gibson.Harness";

import "gibson/common/v1/gibson_common.proto";
import "gibson/types/v1/types.proto";
import "gibson/graphrag/v1/graphrag.proto";
import "gibson/mission/v1/mission_definition.proto";
import "gibson/job/v1/job.proto";
import "buf/validate/validate.proto";

import "gibson/auth/v1/options.proto";
// HarnessCallbackService provides the harness interface for agents executing in standalone mode.
// The SDK's CallbackHarness forwards all harness operations to the orchestrator via this service.
service HarnessCallbackService {
    // LLM Operations
    rpc LLMComplete(LLMCompleteRequest) returns (LLMCompleteResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc LLMCompleteWithTools(LLMCompleteWithToolsRequest) returns (LLMCompleteWithToolsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc LLMCompleteStructured(LLMCompleteStructuredRequest) returns (LLMCompleteStructuredResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc LLMStream(LLMStreamRequest) returns (stream LLMStreamResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Tool Operations
    rpc CallToolProto(CallToolProtoRequest) returns (CallToolProtoResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc CallToolProtoStream(CallToolProtoStreamRequest) returns (stream CallToolProtoStreamResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc ListTools(ListToolsRequest) returns (ListToolsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // SearchTools returns a small, ranked, authz-filtered set of tools matching
    // a query — the meta-tool surface agents use instead of receiving every tool
    // (ADR-0065). Per-tool authorization is enforced inside the handler;
    // this RPC-level gate only checks that the caller may use the harness.
    rpc SearchTools(SearchToolsRequest) returns (SearchToolsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Tool Work Queue Operations
    rpc QueueToolWork(QueueToolWorkRequest) returns (QueueToolWorkResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc ToolResults(ToolResultsRequest) returns (stream ToolResultsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Plugin Operations
    rpc QueryPlugin(QueryPluginRequest) returns (QueryPluginResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc ListPlugins(ListPluginsRequest) returns (ListPluginsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Agent Operations
    rpc DelegateToAgent(DelegateToAgentRequest) returns (DelegateToAgentResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Finding Operations
    rpc SubmitFinding(SubmitFindingRequest) returns (SubmitFindingResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // Observe emits a typed observation into the World (ADR-0107). The brain
    // resolves identity and topology; scope is derived server-side from context.
    rpc Observe(ObserveRequest) returns (ObserveResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // PlaceBet stakes a calibrated confidence on a Hypothesis (ADR-0122). Betting
    // is a first-class SDK primitive, parallel to Observe: storage, settlement
    // and scoring of the bet are a gibson-side concern (ADR-0123).
    rpc PlaceBet(PlaceBetRequest) returns (PlaceBetResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // SubmitProof triggers settlement of a Bet by submitting the raw evidence
    // an agent's own tools captured (ADR-0131). The agent never submits a
    // verdict or an interpretation — only raw evidence — because a
    // deterministic, typed predicate on the daemon decides settlement, never
    // an LLM and never the bet's own beneficiary. A non-destructive proof
    // settles synchronously; a destructive proof settles only after a prior
    // RequestDestructiveAuthorization approval, and this call never blocks on
    // that decision (ADR-0132).
    rpc SubmitProof(SubmitProofRequest) returns (SubmitProofResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // RequestDestructiveAuthorization asks a human to approve an irreversible
    // demonstration BEFORE the agent performs it (ADR-0132). It returns
    // immediately with a pending request id — the fleet keeps working while
    // the decision is pending. The agent performs the destructive act only
    // after it reads back an approval, then calls SubmitProof.
    rpc RequestDestructiveAuthorization(RequestDestructiveAuthorizationRequest) returns (RequestDestructiveAuthorizationResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // WorldView returns the caller's server-projected slice of the tenant World
    // (ADR-0112). It is the counterpart to Observe: Observe
    // is the agent's only write, WorldView its only read.
    //
    // The slice is projected by the daemon from the mission record it created —
    // the tenant that owns the World and the scope that bounds the slice are read
    // there, never from this request. WorldViewRequest carries no tenant field and
    // no scope field, so an agent cannot name another tenant's World or a wider
    // slice: both are unrepresentable rather than rejected.
    rpc WorldView(WorldViewRequest) returns (WorldViewResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // Knowledge Operations
    //
    // The knowledge-graph READ surface. It exists on ComponentService too, and
    // that duplication is deliberate: without it here, a dispatched run holding
    // only its task-scoped callback grant cannot read the tenant graph, and the
    // agent would have to keep a component-scoped grant alive purely to call
    // recall — which defeats the point of scoping the dispatch at all.
    // See ADR-0156 and ADR-0161.
    //
    // Read-only by construction. The write half is NOT mirrored: the projector
    // is the sole graph writer (ADR-0112), and ComponentService no longer
    // has a generic graph-write RPC.
    rpc QueryNodes(QueryNodesRequest) returns (QueryNodesResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc FindSimilarAttacks(FindSimilarAttacksRequest) returns (FindSimilarAttacksResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc GetAttackChains(GetAttackChainsRequest) returns (GetAttackChainsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc FindSimilarFindings(FindSimilarFindingsRequest) returns (FindSimilarFindingsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc GetRelatedFindings(GetRelatedFindingsRequest) returns (GetRelatedFindingsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc GetFindings(GetFindingsRequest) returns (GetFindingsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // ApplicationFindings answers the one lifecycle question the reads above
    // cannot: for this Application, what is still open, and does anything
    // actually run the code it is in.
    //
    // The reads above are hybrid vector-and-graph SEARCH — text or embedding, a
    // node-type filter, top-k. Reachability is a TRAVERSAL: is this Package
    // inside an Image that a Deployment of this Application runs, and does that
    // Deployment expose a Host. No top-k over a node-type filter answers it.
    //
    // It is one bounded question rather than a Cypher surface, deliberately: an
    // agent able to send arbitrary Cypher would be a second unaudited path into
    // the tenant graph, and the traversal an agent needs is knowable in advance.
    rpc ApplicationFindings(ApplicationFindingsRequest) returns (ApplicationFindingsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc GetRunFindings(GetRunFindingsRequest) returns (GetRunFindingsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc GetMissionRunHistory(GetMissionRunHistoryRequest) returns (GetMissionRunHistoryResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Planning Operations
    rpc GetPlanContext(GetPlanContextRequest) returns (GetPlanContextResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc ReportStepHints(ReportStepHintsRequest) returns (ReportStepHintsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Distributed Tracing Operations
    rpc RecordSpan(RecordSpanRequest) returns (RecordSpanResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc RecordSpans(RecordSpansRequest) returns (RecordSpansResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Credential Operations
    rpc GetCredential(GetCredentialRequest) returns (GetCredentialResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_resolve"
        object_type: "secret"
        object_deriver: "tenant_and_field('Name')"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Taxonomy Operations
    rpc GetTaxonomySchema(GetTaxonomySchemaRequest) returns (GetTaxonomySchemaResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // ProposeOntologyExtension proposes a new Taxonomy node label or
    // relationship type discovered by an agent at runtime (ADR-0124,
    // ADR-0133). The agent proposes; it never promotes — the
    // daemon checks the identifier against its safety gate before recording
    // it as a per-tenant proposal, and the resulting recurrence only ever
    // feeds a later, explicit tenant-owner approval. This call never blocks
    // on that approval.
    rpc ProposeOntologyExtension(ProposeOntologyExtensionRequest) returns (ProposeOntologyExtensionResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc GenerateNodeID(GenerateNodeIDRequest) returns (GenerateNodeIDResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc ValidateFinding(ValidateFindingRequest) returns (ValidateFindingResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc ValidateGraphNode(ValidateGraphNodeRequest) returns (ValidateGraphNodeResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc ValidateRelationship(ValidateRelationshipRequest) returns (ValidateRelationshipResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Mission Management Operations
    // These enable agents to autonomously create, run, and manage missions
    rpc CreateMission(CreateMissionRequest) returns (CreateMissionResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc RunMission(RunMissionRequest) returns (RunMissionResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc GetMissionStatus(GetMissionStatusRequest) returns (GetMissionStatusResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc WaitForMission(WaitForMissionRequest) returns (WaitForMissionResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc ListMissions(ListMissionsRequest) returns (ListMissionsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc CancelMission(CancelMissionRequest) returns (CancelMissionResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc GetMissionResults(GetMissionResultsRequest) returns (GetMissionResultsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Authorization Operations
    // Authorize checks whether the calling component's current work execution
    // is permitted to perform action on resource. The daemon resolves the
    // run_id to a (user_id, tenant_id) pair and consults FGA.
    rpc Authorize(AuthorizeRequest) returns (AuthorizeResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Workspace operations — added in vX.Y for callback-harness workspace
    // parity with the in-process DefaultAgentHarness path in the Gibson
    // daemon, which is not in this repository.
    //
    // v1 surface: file IO + commit + push. The Editor (SEARCH/REPLACE +
    // LSP) and full GitOps (branching, snapshots) interfaces from
    // codegen/workspace are intentionally out of scope; a follow-on
    // spec will add streaming-aware variants once the LSP-diagnostic-over-
    // the-wire contract is settled.
    //
    // Spec: callback-harness-workspace-rpcs.

    // WorkspaceList returns metadata for every workspace configured for
    // the calling component's active mission. Returns an empty list when
    // the mission has no workspaces.
    rpc WorkspaceList(WorkspaceListRequest) returns (WorkspaceListResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // WorkspaceGetInfo returns name + path for a single workspace. An empty
    // name resolves to the mission's primary workspace (single-repo case).
    // Returns NOT_FOUND when no workspace with that name exists.
    rpc WorkspaceGetInfo(WorkspaceGetInfoRequest) returns (WorkspaceGetInfoResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // WorkspaceReadFile reads a file from the named workspace. Path is
    // relative to the workspace root. Files larger than 16 MB return
    // RESOURCE_EXHAUSTED; a streaming variant is deferred to a follow-on
    // spec.
    rpc WorkspaceReadFile(WorkspaceReadFileRequest) returns (WorkspaceReadFileResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // WorkspaceWriteFile writes content to a file in the named workspace.
    // Path is relative to the workspace root. Content larger than 16 MB
    // returns RESOURCE_EXHAUSTED; a streaming variant is deferred.
    rpc WorkspaceWriteFile(WorkspaceWriteFileRequest) returns (WorkspaceWriteFileResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // WorkspaceListFiles returns paths matching the given glob pattern,
    // relative to the workspace root. Result sets larger than 10,000 paths
    // are truncated to the first 10,000 with truncated=true on the
    // response.
    rpc WorkspaceListFiles(WorkspaceListFilesRequest) returns (WorkspaceListFilesResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // WorkspaceCommit stages all changes in the workspace and creates a
    // commit with the given message. Returns the commit SHA.
    rpc WorkspaceCommit(WorkspaceCommitRequest) returns (WorkspaceCommitResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // WorkspacePush pushes committed changes to the remote configured for
    // the workspace. Returns PERMISSION_DENIED on auth failure against
    // the remote.
    rpc WorkspacePush(WorkspacePushRequest) returns (WorkspacePushResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Session operations (resolved design 2026-08-02). Both share one
    // session identity: an opaque,
    // AGENT-PROVIDED session_id, tenant-scoped — the daemon keys all
    // per-session state by (tenant, session_id). The tenant half is derived
    // server-side from the authenticated caller (system_tenant, exactly as
    // WorldView derives it); no request message carries a tenant field, so a
    // caller cannot name another tenant's session — cross-tenant access is
    // unrepresentable rather than rejected. session_id is NOT the Zitadel
    // UserSession (auth-only) and NOT agent_run_id (per-run): a coding
    // session spans many runs.

    // DevboxExec runs one command in the caller's session Devbox — a
    // session-lifetime sandbox resolved (and lazily created on first call)
    // by (tenant, session_id), then REUSED across calls in that session.
    // This is deliberately distinct from the per-call SANDBOXED tool path
    // (CallToolProto), which stays one microVM per call; a Devbox holds
    // working state (checkouts, build caches) that per-call isolation would
    // throw away between commands.
    rpc DevboxExec(DevboxExecRequest) returns (stream DevboxExecResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Session-context store: an opaque, versioned blob per (tenant,
    // session_id), persisted in the per-tenant dataplane store. The daemon
    // never interprets the bytes — the component owns its own format. This
    // is the TRUSTED home for a session's local context; it must never be
    // written to the untrusted Devbox volume (that invariant is the
    // client's to keep, but this store is why keeping it costs nothing).
    // Writes are guarded by an etag (If-Match) so concurrent writers cannot
    // clobber each other; the server enforces a TTL and a size cap.
    rpc PutSessionContext(PutSessionContextRequest) returns (PutSessionContextResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc GetSessionContext(GetSessionContextRequest) returns (GetSessionContextResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    rpc DeleteSessionContext(DeleteSessionContextRequest) returns (DeleteSessionContextResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // ========================================================================
    // Bank member inbox and jobs (ADR-0119)
    //
    // A bank member is a long-lived sandbox that serves many dispatches. It
    // pulls its input outbound through these RPCs and never accepts an
    // inbound connection. Every input carries the grant of its own dispatch.
    // ========================================================================

    // SubscribeInput streams the inputs for the calling member, in order,
    // across every job it holds. Each Input carries the per-turn grant the
    // member uses for every tool call of that turn. The stream stays open
    // for the life of the member.
    rpc SubscribeInput(SubscribeInputRequest) returns (stream SubscribeInputResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // PullJob returns the next queued job of the calling member's bank, or
    // nothing when the queue is empty. A member with a free slot calls it
    // after each heartbeat. The daemon assigns the job to the member.
    rpc PullJob(PullJobRequest) returns (PullJobResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // ReportJobState tells the daemon a job moved to WORKING or WAITING, and
    // names the Claude Code session that holds it so a restart can resume
    // it. A member never reports CLOSED: a scorer closes the job.
    rpc ReportJobState(ReportJobStateRequest) returns (ReportJobStateResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // ReportDeliverable records one outward result the driver performed at
    // wrap-up: a pushed branch or an opened merge request.
    rpc ReportDeliverable(ReportDeliverableRequest) returns (ReportDeliverableResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // OpenJob opens a job on a bank from a dispatched agent, under its
    // grant. It mirrors gibson.job.v1.JobService.OpenJob.
    rpc OpenJob(OpenJobRequest) returns (OpenJobResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // SendInput sends the next message to an open job from a dispatched
    // agent, under its grant. It mirrors gibson.job.v1.JobService.SendInput.
    rpc SendInput(SendInputRequest) returns (SendInputResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
    // CloseJob closes a job with a verdict and a score from a dispatched
    // agent, under its grant. A verification agent is the usual caller. It
    // mirrors gibson.job.v1.JobService.CloseJob.
    rpc CloseJob(CloseJobRequest) returns (CloseJobResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_use"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }
}

// ============================================================================
// Common Types
// ============================================================================

// Error represents an error response from a callback operation.
message HarnessError {
    gibson.common.v1.ErrorCode code = 1;
    string message = 2;
    bool retryable = 3;
}

// HealthStatus represents the health status of a service.
message HarnessHealthStatus {
    string state = 1;      // healthy, degraded, unhealthy
    string message = 2;
    int64 checked_at = 3;  // Unix timestamp in milliseconds
}

message ContextInfo {
    string task_id = 1;
    string agent_name = 2;
    string trace_id = 3;
    string span_id = 4;
    string mission_id = 5;
    // Mission run ID - unique identifier for this specific mission execution.
    // Created by MissionGraphManager.CreateMissionRunNode() at mission start.
    // Used for mission-scoped GraphRAG storage (nodes BELONGS_TO mission_run).
    string mission_run_id = 6;
    // Agent run ID - unique identifier for this specific agent execution.
    // Used for DISCOVERED relationships and provenance tracking.
    string agent_run_id = 7;
    // Run number - sequential number for this mission (1, 2, 3...).
    // Used for mission memory queries and historical comparisons.
    int32 run_number = 8;
    // Tool execution ID - unique identifier for tool execution provenance.
    // Used to create PRODUCED relationships from tool executions to nodes.
    string tool_execution_id = 9;
}

message TokenUsage {
    int32 input_tokens = 1;
    int32 output_tokens = 2;
    int32 total_tokens = 3;
}

message LLMMessage {
    string role = 1;  // system, user, assistant, tool
    string content = 2;
    repeated ToolCall tool_calls = 3;
    repeated ToolResult tool_results = 4;
    string name = 5;  // For tool messages
}

message ToolCall {
    string id = 1;
    string name = 2;
    string arguments = 3;  // JSON string
}

message ToolResult {
    string tool_call_id = 1;
    string content = 2;
    bool is_error = 3;
}

message ToolDef {
    string name = 1;
    string description = 2;
    JSONSchemaNode parameters = 3;
}

// ============================================================================
// LLM Operations
// ============================================================================

message LLMCompleteRequest {
    ContextInfo context = 1;
    string slot = 2 [(buf.validate.field).string = { max_len: 1024 }];
    repeated LLMMessage messages = 3;

    // Completion options
    optional double temperature = 4;
    optional int32 max_tokens = 5;
    optional double top_p = 6;
    repeated string stop = 7;
}

message LLMCompleteWithToolsRequest {
    ContextInfo context = 1;
    string slot = 2 [(buf.validate.field).string = { max_len: 1024 }];
    repeated LLMMessage messages = 3;
    repeated ToolDef tools = 4;
}

message LLMCompleteStructuredRequest {
    ContextInfo context = 1;
    string slot = 2 [(buf.validate.field).string = { max_len: 1024 }];
    repeated LLMMessage messages = 3;
    string schema_json = 4 [(buf.validate.field).string = { max_len: 16777216 }]; // JSON-encoded schema (Go struct as JSON) - kept for backward compatibility
}

message LLMCompleteStructuredResponse {
    gibson.common.v1.TypedValue result = 1;
    reserved 2;  // Previously result_json
    TokenUsage usage = 3;
    HarnessError error = 4;
}

message LLMCompleteResponse {
    string content = 1;
    repeated ToolCall tool_calls = 2;
    string finish_reason = 3;
    TokenUsage usage = 4;
    HarnessError error = 5;
}

message LLMCompleteWithToolsResponse {
    string content = 1;
    repeated ToolCall tool_calls = 2;
    string finish_reason = 3;
    TokenUsage usage = 4;
    HarnessError error = 5;
}

message LLMStreamRequest {
    ContextInfo context = 1;
    string slot = 2 [(buf.validate.field).string = { max_len: 1024 }];
    repeated LLMMessage messages = 3;

    // Completion options
    optional double temperature = 4;
    optional int32 max_tokens = 5;
    optional double top_p = 6;
    repeated string stop = 7;
}

message LLMStreamResponse {
    string delta = 1;
    repeated ToolCall tool_calls = 2;
    string finish_reason = 3;
    TokenUsage usage = 4;
    HarnessError error = 5;
}

// ============================================================================
// Tool Operations
// ============================================================================

// CallToolProtoRequest invokes a tool using proto-serialized JSON input/output.
message CallToolProtoRequest {
    ContextInfo context = 1;
    string name = 2 [(buf.validate.field).string = { max_len: 1024 }];
    // JSON-serialized proto request message
    bytes input_json = 3;
    // Fully qualified proto message type name for input (e.g., "gibson.tool.mytool.MyRequest")
    string input_type = 4 [(buf.validate.field).string = { max_len: 1024 }];
    // Fully qualified proto message type name for output (e.g., "gibson.tool.mytool.MyResponse")
    string output_type = 5 [(buf.validate.field).string = { max_len: 1024 }];
}

// CallToolProtoResponse returns the tool output as proto-serialized JSON.
message CallToolProtoResponse {
    // JSON-serialized proto response message
    bytes output_json = 1;
    HarnessError error = 2;
}

// CallToolProtoStreamRequest initiates a streaming tool execution.
message CallToolProtoStreamRequest {
    ContextInfo context = 1;
    string name = 2 [(buf.validate.field).string = { max_len: 1024 }];
    // JSON-serialized proto request message
    bytes input_json = 3;
    // Fully qualified proto message type name for input (e.g., "gibson.tool.mytool.MyRequest")
    string input_type = 4 [(buf.validate.field).string = { max_len: 1024 }];
    // Fully qualified proto message type name for output (e.g., "gibson.tool.mytool.MyResponse")
    string output_type = 5 [(buf.validate.field).string = { max_len: 1024 }];
    // Optional timeout in milliseconds
    int64 timeout_ms = 6;
}

// CallToolProtoStreamResponse streams tool execution events back to the agent.
message CallToolProtoStreamResponse {
    oneof payload {
        ToolProgressEvent progress = 1;
        ToolPartialResultEvent partial = 2;
        ToolWarningEvent warning = 3;
        ToolCompleteEvent complete = 4;
        ToolErrorEvent error = 5;
    }
    string trace_id = 10;
    string span_id = 11;
    int64 sequence = 12;
    int64 timestamp_ms = 13;
}

// ToolProgressEvent indicates progress during tool execution
message ToolProgressEvent {
    int32 percent = 1;
    string stage = 2;
    string message = 3;
}

// ToolPartialResultEvent contains partial results during execution
message ToolPartialResultEvent {
    bytes output_json = 1;
    string description = 2;
}

// ToolWarningEvent contains non-fatal warnings during execution
message ToolWarningEvent {
    string message = 1;
    string code = 2;
}

// ToolCompleteEvent signals successful completion with final output
message ToolCompleteEvent {
    bytes output_json = 1;
}

// ToolErrorEvent signals an error during execution
message ToolErrorEvent {
    HarnessError error = 1;
    bool fatal = 2;
}

message ListToolsRequest {
    ContextInfo context = 1;
}

message ListToolsResponse {
    repeated HarnessToolDescriptor tools = 1;
    HarnessError error = 2;
}

message HarnessToolDescriptor {
    string name = 1;
    string description = 2;
    reserved 3;  // Previously schema_json (legacy)
    reserved 4;  // Previously output_schema_json
    // Structured schemas with full taxonomy support
    JSONSchemaNode input_schema = 5;
    JSONSchemaNode output_schema = 6;
}

// SearchToolsRequest carries a tool-discovery query: free text plus structured
// filters. The daemon returns only tools the caller is authorized to invoke.
message SearchToolsRequest {
    ContextInfo context = 1;
    // query is matched (case-insensitively) against tool names and descriptions.
    // Empty matches everything.
    string query = 2 [(buf.validate.field).string = { max_len: 16777216 }];
    // sources optionally restricts results by source ("mcp", "native"). Empty = all.
    repeated string sources = 3;
    // connector optionally restricts results to a single connector instance.
    string connector = 4 [(buf.validate.field).string = { max_len: 4096 }];
    // limit caps the candidate count; zero uses the daemon default.
    int32 limit = 5;
}

// SearchToolsResponse is the authz-filtered candidate set.
message SearchToolsResponse {
    repeated SearchToolsCandidate candidates = 1;
    HarnessError error = 2;
}

// SearchToolsCandidate is one authorized tool the agent may invoke via its
// canonical id.
message SearchToolsCandidate {
    // id is the canonical tool id (mcp:<connector>:<tool> or native:<tool>) the
    // agent passes to invoke the tool.
    string id = 1;
    string source = 2;
    string connector = 3;
    string tool = 4;
    string description = 5;
    // input_schema_json is the JSON-Schema input document, when known.
    string input_schema_json = 6;
}

// QueueToolWorkRequest initiates parallel execution of multiple tool invocations.
message QueueToolWorkRequest {
    ContextInfo context = 1;
    string tool_name = 2 [(buf.validate.field).string = { max_len: 1024 }];
    repeated string input_jsons = 3;  // Each input as JSON string
    string input_type = 4 [(buf.validate.field).string = { max_len: 1024 }]; // Proto message type name
    string output_type = 5 [(buf.validate.field).string = { max_len: 1024 }]; // Expected output type name
}

// QueueToolWorkResponse returns a job ID for tracking the work queue.
message QueueToolWorkResponse {
    string job_id = 1;
    HarnessError error = 2;
}

// ToolResultsRequest requests streaming results for a queued job.
message ToolResultsRequest {
    ContextInfo context = 1;
    string job_id = 2 [(buf.validate.field).string = { max_len: 1024 }];
}

// ToolResultsResponse streams individual results as tool executions complete.
message ToolResultsResponse {
    int32 index = 1;              // Position in original inputs
    string output_json = 2;       // Output as JSON (empty if error)
    string output_type = 3;       // Proto message type
    HarnessError error = 4;       // Error if execution failed
    bool is_final = 5;            // True if this is the last result
}

// JSONSchemaNode represents a JSON Schema node with taxonomy support.
// Used for structured schema transmission that preserves taxonomy mappings.
message JSONSchemaNode {
    string type = 1;  // "string", "number", "integer", "boolean", "array", "object"
    string description = 2;
    map<string, JSONSchemaNode> properties = 3;
    repeated string required = 4;
    JSONSchemaNode items = 5;  // For array types
    repeated string enum_values = 6;
    string format = 7;
    optional double minimum = 8;
    optional double maximum = 9;
    optional int32 min_length = 10;
    optional int32 max_length = 11;
    optional int32 min_items = 12;
    optional int32 max_items = 13;
    optional string pattern = 14;
    optional string default_value = 15;
    bool nullable = 16;
    TaxonomyMapping taxonomy = 17;  // Taxonomy mapping for knowledge graph extraction
}

// TaxonomyMapping defines how tool output maps to knowledge graph nodes.
// Uses deterministic ID generation based on identifying properties instead of templates.
message TaxonomyMapping {
    string node_type = 1;  // e.g., "host", "port", "finding"
    map<string, string> identifying_properties = 2;  // Property name -> JSONPath expression for ID generation
    repeated PropertyMapping properties = 3;
    repeated RelationshipMapping relationships = 4;
}

// PropertyMapping maps a source field to a target property.
message PropertyMapping {
    string source = 1;  // JSONPath expression, e.g., "$.ip"
    string target = 2;  // Property name, e.g., "ip_address"
    string default_value = 3;  // Default value if source is missing
    string transform = 4;  // Transformation function (e.g., "lowercase", "trim")
}

// NodeReference identifies a node by type and property mappings.
// Use type="self" to reference the current node being mapped.
message NodeReference {
    string type = 1;  // Node type (e.g., "host", "port") or "self" for current node
    map<string, string> properties = 2;  // Identifying property name -> JSONPath expression
}

// RelationshipMapping defines relationships between nodes using typed references.
message RelationshipMapping {
    string type = 1;  // e.g., "HAS_PORT", "DISCOVERED_BY"
    NodeReference from = 2;  // Source node reference (use type="self" for current node)
    NodeReference to = 3;  // Target node reference
    string condition = 4;  // Optional condition for creating this relationship
    repeated PropertyMapping rel_properties = 5;  // Property mappings for the relationship edge
}

