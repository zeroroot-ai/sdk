        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // =========================================================================
    // =========================================================================

    // =========================================================================
    // Harness Proxy — Mission Management
    // =========================================================================

    // CreateMission creates a new sub-mission.
    rpc CreateMission(CreateMissionRequest) returns (CreateMissionResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // RunMission queues a mission for execution.
    rpc RunMission(RunMissionRequest) returns (RunMissionResponse) {
