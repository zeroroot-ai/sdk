syntax = "proto3";

package gibson.component.v1;

option go_package = "github.com/zeroroot-ai/sdk/api/gen/gibson/component/v1;componentpb";
option java_multiple_files = true;
option csharp_namespace = "Gibson.Component";

import "gibson/bank/v1/bank.proto";
import "gibson/graphrag/v1/graphrag.proto";

import "gibson/auth/v1/options.proto";
// DispatchMode identifies how the Gibson daemon should dispatch calls to a
// component registered in the ComponentRegistry. The enum lets one registry
// serve tools (sandboxed microVM dispatch), plugins (long-running stateful
// gRPC), and agents (long-running gRPC) uniformly — consumers look up by
// name and switch on dispatch_mode to choose the route.
enum DispatchMode {
    DISPATCH_MODE_UNSPECIFIED = 0;
    // DISPATCH_MODE_SANDBOXED: the component is a stateless tool executed in
    // an ephemeral Setec microVM. The registry entry carries image/env/
    // resources used to Launch the sandbox per call.
    DISPATCH_MODE_SANDBOXED = 1;
    // DISPATCH_MODE_PLUGIN: the component is a long-running plugin process
    // that heartbeats to the registry and serves gRPC.
    DISPATCH_MODE_PLUGIN = 2;
    // DISPATCH_MODE_AGENT: the component is a long-running agent process that
    // heartbeats to the registry and serves gRPC.
    DISPATCH_MODE_AGENT = 3;
}

// ContentTrust classifies the trust level of input data a component will
// process at call-time. The daemon's dispatch policy gate consults this
// classification together with `dispatch_mode` to decide whether a call may
// proceed: an UNTRUSTED component MUST be dispatched via DISPATCH_MODE_SANDBOXED
// (microVM) — direct PLUGIN/AGENT execution against UNTRUSTED data is denied
// unless a platform-operator override is active.
//
// The default zero value (CONTENT_TRUST_UNSPECIFIED) is treated as TRUSTED by
// the gate for backward compatibility with descriptors registered before this
// field existed; operators can flip the daemon's `strictDefaultUntrusted=true`
// flag to invert that default during a phased rollout.
enum ContentTrust {
    CONTENT_TRUST_UNSPECIFIED = 0;
    // CONTENT_TRUST_TRUSTED: input data is sourced from trusted, in-cluster
    // origins (operator-installed plugins, internal services, vetted manifests)
    // and may safely run in PLUGIN/AGENT processes.
    CONTENT_TRUST_TRUSTED = 1;
    // CONTENT_TRUST_UNTRUSTED: input data is sourced from external networks,
    // user-supplied targets, or third-party feeds (DNS responses, scanned hosts,
    // template downloads, etc.). MUST be dispatched via SANDBOXED execution.
    CONTENT_TRUST_UNTRUSTED = 2;
}

// ParseQuality tags how richly a sandboxed-tool response populates its
// field-100 DiscoveryResult. The taxonomy persistence layer uses this to
// filter queries by data quality.
enum ParseQuality {
    PARSE_QUALITY_UNSPECIFIED = 0;
    // PARSE_QUALITY_STRUCTURED: response includes fully populated taxonomy
    // nodes (Host, Port, Service, Finding, ...).
    PARSE_QUALITY_STRUCTURED = 1;
    // PARSE_QUALITY_PARTIAL: response includes some taxonomy nodes plus raw
    // output preserved in Evidence nodes.
    PARSE_QUALITY_PARTIAL = 2;
    // PARSE_QUALITY_RAW: response preserves stdout as an Evidence node only;
    // no taxonomy-specific nodes were extracted.
    PARSE_QUALITY_RAW = 3;
    // PARSE_QUALITY_FAILED: a parser errored; stdout/stderr preserved for
    // diagnostics, DiscoveryResult is nil.
    PARSE_QUALITY_FAILED = 4;
}

// ComponentService is the central gRPC service that all Gibson components
// (agents, tools, and plugins) connect to. Components register themselves,
// receive work via long-polling, submit results, and access harness operations
// (LLM completion, tool calls, plugin queries, findings, memory) through
// the proxy RPCs defined here.
service ComponentService {
    // RegisterComponent announces a component to Gibson and receives connection
    // configuration including heartbeat and poll intervals.
    rpc RegisterComponent(RegisterComponentRequest) returns (RegisterComponentResponse) {
      option (gibson.auth.v1.authz) = {
        // Serve-side lifecycle RPC (a component announces itself + its methods),
        // not a platform-drive RPC. Gated on can_poll_work so a plugin_principal
        // (which holds can_receive_work, not can_execute) can register — the same
        // relation as PollWork/SubmitResult. Existing can_execute holders
        // (agents/tools) satisfy can_poll_work unchanged.
        relation: "can_poll_work"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Heartbeat sends a periodic health pulse. The response indicates whether
    // the component is still considered registered and may carry config updates.
    rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse) {
      option (gibson.auth.v1.authz) = {
        // Serve-side liveness pulse — gated on can_poll_work, same as the other
        // serve-side RPCs (RegisterComponent/PollWork/SubmitResult), so a plugin
        // can heartbeat without holding the platform-drive grant.
        relation: "can_poll_work"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // PollWork long-polls for work items assigned to this component instance.
    // Returns when a work item is available or the server-side timeout expires.
    //
    // Authorized by can_poll_work, not can_execute: PollWork/SubmitResult are
    // the receive-side of dispatch (how a component gets its work), distinct
    // from CallTool/RunMission's drive-side (how a component directs the
    // platform). Sharing can_execute would let a poll-only grant also drive
    // missions. can_poll_work is modeled as `can_execute or can_receive_work`,
    // so existing can_execute holders keep polling unchanged.
    rpc PollWork(PollWorkRequest) returns (PollWorkResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_poll_work"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // SubmitResult returns the execution result for a previously polled work item.
    //
    // Authorized by can_poll_work — see PollWork's comment for why this
    // receive-side RPC does not share can_execute with the drive-side RPCs.
    rpc SubmitResult(SubmitResultRequest) returns (SubmitResultResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_poll_work"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // Complete proxies an LLM completion request through the agent harness.
    rpc Complete(CompleteRequest) returns (CompleteResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // CompleteStream proxies a streaming LLM completion request through the agent harness.
    rpc CompleteStream(CompleteStreamRequest) returns (stream CompleteStreamResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // CallTool proxies a tool execution request through the agent harness.
    rpc CallTool(CallToolRequest) returns (CallToolResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // QueryPlugin proxies a plugin query request through the agent harness.
    rpc QueryPlugin(QueryPluginRequest) returns (QueryPluginResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // SubmitFinding submits a security finding through the agent harness.
    rpc SubmitFinding(SubmitFindingRequest) returns (SubmitFindingResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // ListAvailablePlugins returns all plugins registered in the system along
    // with their catalog metadata, health status, and configuration schema.
    rpc ListAvailablePlugins(ListAvailablePluginsRequest) returns (ListAvailablePluginsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // EnablePlugin activates a plugin for the calling tenant, optionally
    // supplying an initial configuration JSON blob.
    rpc EnablePlugin(EnablePluginRequest) returns (EnablePluginResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_configure"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // DisablePlugin deactivates a plugin for the calling tenant.
    rpc DisablePlugin(DisablePluginRequest) returns (DisablePluginResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_configure"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // UpdatePluginConfig replaces the configuration for an already-enabled plugin.
    rpc UpdatePluginConfig(UpdatePluginConfigRequest) returns (UpdatePluginConfigResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_configure"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // GetPluginConfig retrieves the current configuration and schema for a plugin.
    rpc GetPluginConfig(GetPluginConfigRequest) returns (GetPluginConfigResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // TestPluginConnection validates connectivity and credentials for a plugin
    // without persisting any state changes.
    rpc TestPluginConnection(TestPluginConnectionRequest) returns (TestPluginConnectionResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_configure"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // ListTenantPlugins returns the plugin access records for the calling tenant.
    rpc ListTenantPlugins(ListTenantPluginsRequest) returns (ListTenantPluginsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // =========================================================================
    // Harness Proxy — LLM (extended)
    // =========================================================================

    // CompleteWithTools proxies an LLM completion with tool definitions for
    // function-calling support. Returns the response including any tool calls.
    rpc CompleteWithTools(CompleteWithToolsRequest) returns (CompleteWithToolsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // CompleteStructured proxies an LLM completion requesting JSON output
    // conforming to the supplied schema.
    rpc CompleteStructured(CompleteStructuredRequest) returns (CompleteStructuredResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // =========================================================================
    // Harness Proxy — Tools (extended)
    // =========================================================================

    // CallToolStream proxies a tool execution with server-side streaming of
    // progress, partial results, warnings, and the final output.
    rpc CallToolStream(CallToolStreamRequest) returns (stream CallToolStreamResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // QueueToolWork submits a batch of tool invocations for parallel execution
    // and returns a job ID for tracking.
    rpc QueueToolWork(QueueToolWorkRequest) returns (QueueToolWorkResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // ToolResults streams results for a previously queued tool batch as each
    // invocation completes.
    rpc ToolResults(ToolResultsRequest) returns (stream ToolResultsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // ListTools returns descriptors for all tools visible to the caller's tenant.
    rpc ListTools(ListToolsRequest) returns (ListToolsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // =========================================================================
    // Harness Proxy — Agent Delegation
    // =========================================================================

    // DelegateToAgent dispatches a sub-task to another agent and returns its result.
    rpc DelegateToAgent(DelegateToAgentRequest) returns (DelegateToAgentResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // ListAgents returns descriptors for all agents visible to the caller's tenant.
    rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // =========================================================================
    // Harness Proxy — GraphRAG
    // =========================================================================

    // QueryNodes searches the knowledge graph using hybrid vector + graph scoring.
    rpc QueryNodes(QueryNodesRequest) returns (QueryNodesResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // FindSimilarAttacks returns attack patterns semantically similar to the given content.
    rpc FindSimilarAttacks(FindSimilarAttacksRequest) returns (FindSimilarAttacksResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // GetAttackChains returns multi-hop attack paths from a starting technique.
    rpc GetAttackChains(GetAttackChainsRequest) returns (GetAttackChainsResponse) {
      option (gibson.auth.v1.authz) = {
        relation: "can_execute"
        object_type: "component"
        object_deriver: "system_tenant"
        allowed_identities: 4  // COMPONENT
      };
    }

    // FindSimilarFindings returns findings semantically similar to the given finding.
    rpc FindSimilarFindings(FindSimilarFindingsRequest) returns (FindSimilarFindingsResponse) {
