syntax = "proto3";

// Package gibson.pluginadmin.v1 — PluginAdminService: customer-callable plugin
// registration / install-management surface and the developer plugin-publish
// dev-loop. Re-homed out of gibson.tenant.v1 into its own wire package so it
// can stay in the OSS SDK while the nine tenant-administration services move
// to the gibson platform protos under the unchanged gibson.tenant.v1 package
// — keeping both in one package would link two generated Go homes for
// gibson.tenant.v1 into the daemon (proto: duplicate registration). See
// ADR-0058 (amended 2026-06-22).
//
// Authorization: every RPC carries a (gibson.auth.v1.authz) annotation.
package gibson.pluginadmin.v1;

option go_package = "github.com/zeroroot-ai/sdk/api/gen/gibson/pluginadmin/v1;pluginadminv1";

import "gibson/auth/v1/options.proto";

// PluginAdminService manages plugin installs and their secret bindings.
service PluginAdminService {
  // ListPluginInstalls returns all plugin installs for the tenant.
  rpc ListPluginInstalls(ListPluginInstallsRequest) returns (ListPluginInstallsResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 1  // USER
    };
  }
  // GetPluginInstall returns one install by ID.
  rpc GetPluginInstall(GetPluginInstallRequest) returns (GetPluginInstallResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "member"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 1  // USER
    };
  }
  // RegisterPlugin atomically registers a plugin per Spec 2 R3.1: validates
  // manifest, creates the Zitadel plugin_principal SA, writes per-binding
  // FGA can_resolve tuples (creating any inline secrets in the broker),
  // returns the bootstrap token. Any partial failure rolls back all created state.
  rpc RegisterPlugin(RegisterPluginRequest) returns (RegisterPluginResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "admin"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 1  // USER
    };
  }
  // EditPluginSecretBinding modifies an existing binding (rebind to a different
  // existing secret). Used by the plugin detail page's bindings table.
  rpc EditPluginSecretBinding(EditPluginSecretBindingRequest) returns (EditPluginSecretBindingResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "admin"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 1  // USER
    };
  }
  // RevokePluginSecretBinding removes an FGA can_resolve tuple between the
  // plugin and a secret. Emits a secret_access_revoked audit event.
  rpc RevokePluginSecretBinding(RevokePluginSecretBindingRequest) returns (RevokePluginSecretBindingResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "admin"
      object_type: "tenant"
      object_deriver: "tenant_from_identity"
      allowed_identities: 1  // USER
    };
  }
}

// ---------------------------------------------------------------------------
// PluginAdminService types
// ---------------------------------------------------------------------------

// PluginInstallStatus mirrors the daemon's transient runtime status for a
// plugin install. The dashboard renders this as a badge on the plugin detail page.
enum PluginInstallStatus {
  PLUGIN_INSTALL_STATUS_UNSPECIFIED = 0;

  // PLUGIN_INSTALL_STATUS_SERVING: install heartbeated within TTL and is
  // accepting work.
  PLUGIN_INSTALL_STATUS_SERVING = 1;

  // PLUGIN_INSTALL_STATUS_UNREACHABLE: install has not heartbeated within
  // 90 seconds; not eligible for dispatch.
  PLUGIN_INSTALL_STATUS_UNREACHABLE = 2;

  // PLUGIN_INSTALL_STATUS_DEGRADED: install heartbeats but reports errors
  // on its method invocations.
  PLUGIN_INSTALL_STATUS_DEGRADED = 3;
}

// PluginInstallSummary is the wire-shape returned by ListPluginInstalls and
// GetPluginInstall.
message PluginInstallSummary {
  string install_id = 1;
  string name = 2;
  string version = 3;
  repeated string declared_methods = 4;
  string runtime_mode = 5;
  bool setec_required = 6;
  string host_id = 7;
  PluginInstallStatus status = 8;
  string address = 9;
  int64 last_heartbeat_at_unix = 10;
  int64 created_at_unix = 11;
  repeated string bound_secret_refs = 12;
}

// PluginSecretBinding describes one secret binding in a RegisterPlugin request.
message PluginSecretBinding {
  // declared_name is the name as declared in the plugin manifest's
  // spec.secrets[] entry.
  string declared_name = 1;
  // mode is one of: "existing" (bind to existing secret) or "create" (create
  // new secret inline).
  string mode = 2;
  // existing_ref is the broker-namespaced name of an already-stored secret
  // to bind to. Set when mode = "existing".
  string existing_ref = 3;
  // create_value is the plaintext bytes to store under declared_name when
  // mode = "create". TLS in transit; never logged.
  bytes create_value = 4;
}

// PluginManifestValidationError carries one structured manifest error.
message PluginManifestValidationError {
  // field is the dotted JSONPath into the manifest.
  string field = 1;
  int32 line = 2;
  string code = 3;
  string message = 4;
}

// ---------------------------------------------------------------------------
// PluginAdminService request/response messages
// ---------------------------------------------------------------------------

message ListPluginInstallsRequest {
  string name_filter = 1;
  PluginInstallStatus status_filter = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message ListPluginInstallsResponse {
  repeated PluginInstallSummary installs = 1;
  int32 total = 2;
}

message GetPluginInstallRequest {
  string install_id = 1;
}

message GetPluginInstallResponse {
  PluginInstallSummary install = 1;
}

message RegisterPluginRequest {
  // manifest_yaml is the plugin manifest YAML bytes.
  bytes manifest_yaml = 1;
  repeated PluginSecretBinding bindings = 2;
  // dry_run, when true, validates manifest + bindings without creating any state.
  bool dry_run = 3;
  // remote, when true, registers an MCP connector for execution in the
  // customer's own network instead of a gibson-hosted setec sandbox
  // (ADR-0048 remote-deployment path). The daemon skips the hosted launch
  // and the response carries the one-time bootstrap_token; the customer runs
  // the MCP-bridge themselves and the bridge redeems the token to enroll.
  // Only valid for connector manifests (connector.gibson.zeroroot.ai/v1):
  // plain plugins are always customer-run and already receive the token.
  bool remote = 4;
}

message RegisterPluginResponse {
  string install_id = 1;
  string plugin_principal_id = 2;
  // bootstrap_token is the single-use enrollment token. Empty when dry_run.
  string bootstrap_token = 3;
  int64 bootstrap_token_expires_at_unix = 4;
  repeated PluginManifestValidationError validation_errors = 5;
}

message EditPluginSecretBindingRequest {
  string install_id = 1;
  string declared_name = 2;
  string new_existing_ref = 3;
}

message EditPluginSecretBindingResponse {}

message RevokePluginSecretBindingRequest {
  string install_id = 1;
  string declared_name = 2;
}

message RevokePluginSecretBindingResponse {}
