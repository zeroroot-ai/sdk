syntax = "proto3";

// Package gibson.auth.v1 defines the AuthOptions extension that every Gibson
// gRPC method MUST carry. The extension is the single source of truth for the
// (RPC -> authorization rule) mapping. It is consumed by:
//   - the authz-registry-gen tool (sdk/cmd/authz-registry-gen) to emit a typed
//     Go map, a YAML registry consumed by ext-authz, an OpenFGA model, and a
//     TypeScript permission table for the dashboard;
//   - the daemon's startup self-check to verify every registered gRPC method
//     has a matching registry entry;
//   - the buf-lint-authz-required plugin to fail CI if any RPC lacks the
//     annotation.
//
// Spec: unified-identity-and-authorization Requirement 7.
package gibson.auth.v1;

import "google/protobuf/descriptor.proto";

option go_package = "github.com/zeroroot-ai/sdk/api/gen/gibson/auth/v1;authv1";

// IdentityClass is a bitfield that declares which classes of caller may invoke
// the RPC. Multiple bits MAY be set (an RPC callable by both a human user and
// a platform-operator service uses USER | PLATFORM_OPERATOR).
//
// The classes are deliberately broad — fine-grained access control is the job
// of OpenFGA via the (relation, object_type, object_deriver) triple. The
// IdentityClass bitfield is a fast pre-filter and a documentation contract.
enum IdentityClass {
  // IDENTITY_CLASS_UNSPECIFIED is invalid and MUST cause the
  // authz-registry-gen tool to reject the proto. Every authz annotation must
  // explicitly state which identities may call the RPC.
  IDENTITY_CLASS_UNSPECIFIED = 0;

  // IDENTITY_CLASS_USER is a human authenticated via Zitadel OIDC code flow.
  // Subject is a Zitadel user ID. The dashboard forwards this caller class on
  // user-acting routes.
  IDENTITY_CLASS_USER = 1;

  // IDENTITY_CLASS_SERVICE is a platform service authenticated via Zitadel
  // OAuth2 client_credentials grant. Subject is a Zitadel service-account ID.
  // The dashboard pod, tenant-operator, gibson-tool-runner, and similar
  // platform components use this class.
  IDENTITY_CLASS_SERVICE = 2;

  // IDENTITY_CLASS_COMPONENT is an agent / tool / plugin runtime
  // authenticated via Zitadel client_credentials. Subject is the registered
  // component's service-account ID. Component callers usually also present a
  // capability-grant JWT scoping their per-task RPC set; ext-authz
  // short-circuits FGA when the CG-JWT covers the requested method.
  IDENTITY_CLASS_COMPONENT = 4;

  // IDENTITY_CLASS_PLATFORM_OPERATOR is a platform-operator service account
  // with cross-tenant authority (e.g. tenant-operator on its admin RPCs,
  // billing aggregators). FGA gates these RPCs on the platform_operator
  // relation against the system tenant.
  IDENTITY_CLASS_PLATFORM_OPERATOR = 8;
}

// AuthOptions is the per-method authorization annotation. It is attached to
// every RPC via the (gibson.auth.v1.authz) extension.
//
// Three mutually-exclusive forms (at most one may be set per RPC):
//   1) unauthenticated = true: the RPC is callable without identity (Ping,
//      health checks). The relation/object/allowed_identities fields MUST be
//      empty in this form.
//   2) rule form (unauthenticated = false, self = false, default): the RPC
//      requires identity and an OpenFGA tuple check. The relation, object_type,
//      object_deriver, and allowed_identities fields MUST be populated.
//   3) self = true: "authenticated user reading their own data". No FGA tuple
//      exists to check; the caller IS the subject. The following contract
//      applies:
//        (a) Envoy jwt_authn runs and validates the caller's JWT before the
//            request reaches ext-authz.
//        (b) ext-authz skips the FGA Check call (no OpenFGA round-trip).
//        (c) ext-authz still applies the per-RPC allowed_identities bitfield;
//            callers of a class not in the bitfield are rejected.
//        (d) The daemon handler is responsible for scoping the response to the
//            verified caller subject (via X-Gibson-Identity-Subject).
//      allowed_identities MUST be set when self = true. Spec: self-mode-authz.
message AuthOptions {
  // relation is the OpenFGA relation evaluated against the derived object
  // (e.g. "member", "admin", "platform_operator", "can_read_credential").
  // Required when unauthenticated is false and self is false.
  string relation = 1;

  // object_type is the OpenFGA object type the relation is evaluated against
  // (e.g. "tenant", "mission", "credential", "system_tenant"). Required when
  // unauthenticated is false and self is false.
  string object_type = 2;

  // object_deriver is the rule for deriving the concrete OpenFGA object
  // identifier from the request. Supported derivers (extensible):
  //
  //   - "tenant_from_identity"          : object = "tenant:" + identity.tenant
  //   - "system_tenant"                 : object = "system_tenant:_system"
  //   - "from_field('<name>')"          : object = "<object_type>:" + req.<name>
  //   - "tenant_and_field('<name>')"    : object = "<object_type>:" + identity.tenant + ":" + req.<name>
  //
  // Required when unauthenticated is false and self is false. The grammar is
  // interpreted by the ext-authz registry loader; unknown derivers cause
  // ext-authz to refuse to start (fail-closed).
  string object_deriver = 3;

  // allowed_identities is a bitfield of IdentityClass values listing every
  // class of caller permitted to invoke this RPC. ext-authz pre-filters on
  // this before consulting FGA: callers of a class not in the bitfield are
  // rejected without an FGA call.
  //
  // Required when unauthenticated is false (rule form) or when self is true.
  // At least one bit MUST be set in those cases.
  int32 allowed_identities = 4;

  // unauthenticated, when true, signals that the RPC bypasses ext-authz
  // entirely and is callable without any identity. Only Ping, health checks,
  // and equivalent unconditionally-public methods may set this.
  //
  // The buf-lint-authz-required plugin tolerates `unauthenticated: true`
  // alone; setting any other field alongside it is a lint error.
  bool unauthenticated = 5;

  // self, when true, declares that this is a "user reads their own data" RPC
  // that requires a valid JWT identity but does not need an OpenFGA tuple
  // lookup (the caller IS the subject — there is nothing to check). ext-authz
  // will:
  //   (a) still validate that Envoy ran jwt_authn (subject header is non-empty);
  //   (b) skip the FGA Check call entirely;
  //   (c) apply the allowed_identities bitfield to reject wrong caller classes;
  //   (d) return OK, relying on the daemon handler to self-scope the response.
  //
  // Mutually exclusive with unauthenticated and with the rule form
  // (relation/object_type/object_deriver). Setting self = true without
  // allowed_identities is a codegen error. Spec: self-mode-authz.
  bool self = 6;
}

// authz is the MethodOptions extension. Field number 50001 is reserved for
// Gibson's authorization annotations and MUST NOT change — the daemon's
// startup self-check, the registry codegen tool, and the buf lint plugin all
// hard-code this number for direct access without an import dance.
//
// Usage:
//
//   service ExampleService {
//     rpc DoThing(DoThingRequest) returns (DoThingResponse) {
//       option (gibson.auth.v1.authz) = {
//         relation: "member",
//         object_type: "tenant",
//         object_deriver: "tenant_from_identity",
//         allowed_identities: 1  // IDENTITY_CLASS_USER
//       };
//     }
//   }
extend google.protobuf.MethodOptions {
  AuthOptions authz = 50001;
}
