syntax = "proto3";

package gibson.plugin.v1;

option go_package = "github.com/zeroroot-ai/sdk/api/gen/gibson/plugin/v1;pluginpb";
option java_multiple_files = true;
option csharp_namespace = "Gibson.Plugin";

import "google/protobuf/any.proto";
import "gibson/auth/v1/options.proto";

// PluginInvokeService is the tool-callable RPC for invoking plugin methods.
// Tools call PluginInvoke; the daemon validates authz, looks up an active plugin
// install, enqueues a work item via the existing ComponentService PollWork model,
// awaits SubmitResult, and forwards the result to the tool. Plugin business
// methods themselves are NOT defined here — the plugin's manifest declares its
// own method set per the plugin-runtime manifest spec, and the dispatch is by
// method-name string carried in PluginInvokeRequest.
service PluginInvokeService {
  // PluginInvoke routes a typed invocation to a serving plugin install.
  rpc PluginInvoke(PluginInvokeRequest) returns (PluginInvokeResponse) {
    option (gibson.auth.v1.authz) = {
      relation: "can_invoke"
      object_type: "plugin"
      object_deriver: "tenant_and_field('PluginName')"
      allowed_identities: 4  // IDENTITY_CLASS_COMPONENT — tools call this
    };
  }
}

message PluginInvokeRequest {
  // plugin_name is the manifest.metadata.name of the target plugin.
  string plugin_name = 1;

  // method is the name of the plugin method to invoke. Must match one of the
  // plugin's declared methods in its manifest.
  string method = 2;

  // request carries the typed request payload as a google.protobuf.Any. The
  // plugin SDK unmarshals using the proto descriptor set the plugin uploaded
  // at registration time.
  google.protobuf.Any request = 3;

  // deadline_ms is the maximum time in milliseconds the daemon should wait for
  // the plugin to claim and submit. Capped at 60000 (60s) by the daemon.
  int64 deadline_ms = 4;
}

message PluginInvokeResponse {
  // result carries the typed response payload, populated on success. Empty on error.
  google.protobuf.Any result = 1;

  // error is populated when the plugin returned an error or the dispatch failed.
  PluginError error = 2;
}

message PluginError {
  enum Kind {
    PLUGIN_ERROR_KIND_UNSPECIFIED = 0;
    // PLUGIN_ERROR_KIND_UNAVAILABLE: no serving install or all installs unreachable.
    PLUGIN_ERROR_KIND_UNAVAILABLE = 1;
    // PLUGIN_ERROR_KIND_UNAUTHORIZED: FGA deny — defense in depth (ext-authz already denied at edge).
    PLUGIN_ERROR_KIND_UNAUTHORIZED = 2;
    // PLUGIN_ERROR_KIND_METHOD_NOT_FOUND: method not in the plugin's declared methods.
    PLUGIN_ERROR_KIND_METHOD_NOT_FOUND = 3;
    // PLUGIN_ERROR_KIND_DEADLINE_EXCEEDED: plugin did not return within deadline_ms.
    PLUGIN_ERROR_KIND_DEADLINE_EXCEEDED = 4;
    // PLUGIN_ERROR_KIND_HANDLER_FAILED: plugin handler returned a non-nil error.
    PLUGIN_ERROR_KIND_HANDLER_FAILED = 5;
    // PLUGIN_ERROR_KIND_INTERNAL: server-side error.
    PLUGIN_ERROR_KIND_INTERNAL = 6;
  }
  Kind kind = 1;

  // message is human-readable. NEVER includes resolved secret values.
  string message = 2;
}
