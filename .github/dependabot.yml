version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "go"]
    ignore:
      # GO-2026-6443 (CVE-2026-84445, a server panic via a missing authority
      # or Host header) is fixed in 1.82.2 and in 1.83.2, and then REOPENS at
      # 1.84.0-dev. Its only later fix is a pseudo-version on the dev branch,
      # so 1.84.x is an upgrade INTO a reachable advisory with no release to
      # move to. #149 made exactly that bump and gibson's merge-queue
      # govulncheck caught it two releases later.
      #
      # Keyed to the minor, not to 1.84.0: the whole 1.84 line is inside the
      # reopened range. Delete this entry when 1.85.0 ships.
      - dependency-name: "google.golang.org/grpc"
        versions: ["1.84.x"]
  - package-ecosystem: "gomod"
    directory: "/examples/custom-tool"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "go"]
  - package-ecosystem: "gomod"
    directory: "/examples/minimal-agent"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "go"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "npm"]
  - package-ecosystem: "docker"
    directory: "/examples/tool-runner-hello"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "docker"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
    labels: ["dependencies", "github-actions"]
    # github/codeql-action is one action with several sub-actions (init,
    # autobuild, analyze, upload-sarif). Dependabot sees each sub-action as
    # its own dependency and bumps them in separate PRs. One of those PRs
    # merged alone leaves init and analyze at different versions, and the
    # CodeQL run fails with "Loaded a configuration file for version X, but
    # running version Y" (.github#121). Group them so they bump together.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
