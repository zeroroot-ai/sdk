# CodeQL configuration. Pin bundle + queries via Renovate (PRD 1.5).
name: "zeroroot-ai default CodeQL config"

# The suite is security-extended, as in each repo that runs CodeQL (ADR-0018).
queries:
  - uses: security-extended

# Exclude generated code paths from analysis surface.
paths-ignore:
  - "**/zz_generated*.go"
  - "**/*.pb.go"
  - "**/*_grpc.pb.go"
  - "vendor/**"
  - "**/testdata/**"
  - "**/.worktrees/**"
