name: CodeQL

# Each repo runs CodeQL through the one shared workflow of .github
# (ADR-0018). The shared workflow sets the suite security-extended and
# loads the custom queries of actions/codeql-queries. This file sets the
# triggers, the languages, the build and the ignored paths only.
#
# The triggers are push to main and workflow_dispatch. An upload from a
# merge_group run goes to a temporary ref, so it does not retire an alert on
# main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: zeroroot-ai/.github/.github/workflows/reusable-codeql.yml@9e8c9f5b6f1ff36c0dd7cefe24fcf739c95b2055 # v0.21.2
    with:
      languages: '["go","actions"]'
      go-build-command: go build ./...
      # Generated code is not analyzed.
      paths-ignore: |
        **/zz_generated*.go
        **/*.pb.go
        **/*_grpc.pb.go
        vendor/**
        **/testdata/**
        **/.worktrees/**
