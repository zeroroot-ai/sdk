# Calls the org-level reusable architectural-doc-coverage workflow.
# See zeroroot-ai/.github/.github/workflows/architectural-doc-coverage.yml
# for the gate's logic, configuration, and rationale.
#
# Required check name: architectural-doc-coverage

name: architectural-doc-coverage

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  architectural-doc-coverage:
    # Mirrors the reusable workflow's own `permissions:` block exactly
    # (zeroroot-ai/.github .github/workflows/architectural-doc-coverage.yml)
    # -- the caller's permissions are a ceiling on what a workflow_call can
    # grant the called workflow's GITHUB_TOKEN, so this must match or exceed
    # it. Fixes CodeQL actions/missing-workflow-permissions (sdk
    # code-scanning alert #1).
    permissions:
      pull-requests: read
      contents: read
    # zeroroot-ai/.github's default branch, resolved 2026-08-15. This is a
    # floating branch ref by design (org workflow contract intentionally
    # tracks HEAD) -- re-resolve on any bump.
    uses: zeroroot-ai/.github/.github/workflows/architectural-doc-coverage.yml@40c67fd77152f2c4924abccbd992dbca065f325b # v0.8.2
    secrets:
      DOCS_REPO_READ_TOKEN: ${{ secrets.DOCS_REPO_READ_TOKEN }}
