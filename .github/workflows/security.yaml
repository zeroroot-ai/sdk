# Spec: security-hardening Requirement 5 (Go-CVE policy).
#
# Epic: cicd-efficiency (board #44), slice S11b. This used to run govulncheck
# against the root module AND both example modules on every PR and every push
# to main. The root-module scan is now redundant: go-ci.yml's `heavy` job
# (merge_group) already runs govulncheck against the root module via the
# reusable's heavy tier, so re-running it here would be pure duplicate
# compute -- dropped.
#
# examples/custom-tool and examples/minimal-agent are each their own Go
# module (separate go.mod), so the reusable's single-module govulncheck call
# doesn't reach them. Those two scans are preserved here, natively, on
# merge_group only (decision 9: scanners belong on the authoritative gate,
# not per-PR).
#
# Local invocation is forbidden per CLAUDE.md (CPU thrash); this workflow is
# the canonical place to surface CVE failures for the example modules.
name: security

on:
  merge_group:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  govulncheck-examples:
    name: govulncheck (examples)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install govulncheck
        # Pinned: Scorecard Pinned-Dependencies flags `@latest` (sdk#18).
        #
        # Must be a release whose VENDORED x/tools can analyse this module's
        # language version. govulncheck ships its own SSA builder, so the
        # toolchain that compiles it does not decide this — rebuilding v1.1.4
        # with go1.27.1 still panics part-way through the scan:
        #
        #   panic: unexpected expr: *ast.KeyValueExpr
        #   golang.org/x/tools@v0.29.0/go/ssa/builder.go:958
        #
        # A Go panic exits 2, so the job reads as a scan failure rather than as
        # a tool that never ran. v1.8.0 vendors x/tools v0.50.0.
        #
        # Keep at or above the x/tools this module's Go floor needs. Same class
        # as golangci-lint below v2.14.0 and deadcode below v0.49.0.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: run govulncheck on examples/custom-tool
        working-directory: examples/custom-tool
        run: govulncheck ./...

      - name: run govulncheck on examples/minimal-agent
        working-directory: examples/minimal-agent
        run: govulncheck ./...
