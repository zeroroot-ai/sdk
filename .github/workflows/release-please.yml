name: release-please

on:
  push:
    branches: [main]

# The default GITHUB_TOKEN does no work here. release-please runs with the
# zeroday-sdk-fanout App token minted below, so its release PR, commits and
# the tag push all use that token, and the tag push fires fan-out.yml
# (on.push.tags), which a GITHUB_TOKEN push would not. The App token carries
# its own contents + pull-requests write scope, so GITHUB_TOKEN stays
# read-only (Scorecard Token-Permissions, sdk#18).
permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.SDK_FANOUT_APP_ID }}
          private-key: ${{ secrets.SDK_FANOUT_APP_PRIVATE_KEY }}
          owner: zeroroot-ai
          repositories: sdk

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
