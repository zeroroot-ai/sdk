name: release-please

on:
  push:
    branches: [main]
  # Manual re-fire. A merge-queue merge can drop the push event that normally
  # triggers this workflow (seen on sdk#94, commit 8b7776f: the merge landed on
  # main with only merge_group runs, so no release PR was cut). workflow_dispatch
  # lets an operator re-run release-please against main without a new commit.
  workflow_dispatch:

# The default GITHUB_TOKEN does no work here. release-please runs with the
# zeroday-sdk-fanout App token minted below, so its release PR, commits and
# the tag push all use that token, and the tag push fires fan-out.yml
# (on.push.tags), which a GITHUB_TOKEN push would not. The App token carries
# its own contents + pull-requests write scope, so GITHUB_TOKEN stays
# read-only (Scorecard Token-Permissions, sdk#18).
permissions:
  contents: read

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.SDK_FANOUT_APP_ID }}
          private-key: ${{ secrets.SDK_FANOUT_APP_PRIVATE_KEY }}
          owner: zeroroot-ai
          repositories: sdk

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # A tag pushed by this run's App token SHOULD fire the on.push.tags
      # workflows, but that event is unreliable — it fired for v0.183.0 and
      # dropped for v0.183.1, leaving BSR a release behind until buf-push was
      # dispatched by hand (fd/a5, 2026-09-29). So this run dispatches the
      # tag-triggered publishers explicitly for the tag it just cut, and those
      # workflows have had their on.push.tags trigger removed so nothing
      # double-fires (a doubled fan-out would open duplicate consumer PRs).
      # A failed dispatch fails THIS run — a missing publish is red, not silent.
      - name: Dispatch tag-triggered publishers for the cut release
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # release-please manifest mode keys outputs by path ('.'); older/newer
          # versions also expose a top-level tag_name. Try both, then fall back
          # to the just-created release via the API, so a changed output name
          # cannot silently drop the dispatch.
          TAG_PATH: ${{ steps.release.outputs['.--tag_name'] }}
          TAG_TOP: ${{ steps.release.outputs.tag_name }}
        run: |
          set -euo pipefail
          TAG="${TAG_PATH:-${TAG_TOP:-}}"
          if [ -z "$TAG" ]; then
            TAG=$(gh release list -R "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName // empty')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::releases_created is true but the cut tag could not be resolved — cannot dispatch publishers"
            exit 1
          fi
          echo "Dispatching downstream publishers for ${TAG}"
          # This job has no checkout, so gh cannot infer the repository from
          # a git remote: every dispatch below failed with "not a git
          # repository" on v0.183.1 and v0.184.0 and the BSR fell behind
          # until a hand-run backfill. Name the repository on every call.
          REPO="${{ github.repository }}"
          fail=0
          gh workflow run buf-push.yml                  -R "$REPO" --ref "$TAG"                || fail=1
          gh workflow run fan-out.yml                   -R "$REPO" --ref "$TAG" -f tag="$TAG"  || fail=1
          gh workflow run docs-spec-sync.yml            -R "$REPO" --ref "$TAG" -f ref="$TAG"  || fail=1
          gh workflow run publish-mission-authoring.yml -R "$REPO" --ref "$TAG" -f tag="$TAG"  || fail=1
          if [ "$fail" -ne 0 ]; then
            echo "::error::one or more downstream publish dispatches failed for ${TAG} — BSR/fan-out/docs/mission-authoring may be behind"
            exit 1
          fi
          echo "All downstream publishers dispatched for ${TAG}"
