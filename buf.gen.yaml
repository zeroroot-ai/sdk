version: v2
managed:
  enabled: true
  disable:
    - file_option: go_package
plugins:
  - local: protoc-gen-go
    out: .
    opt:
      - module=github.com/zeroroot-ai/sdk
  - local: protoc-gen-go-grpc
    out: .
    opt:
      - module=github.com/zeroroot-ai/sdk
  # NOTE: authz-registry-gen is intentionally NOT wired here as a buf
  # local plugin. The buf plugin protocol calls a plugin once per
  # input file, which would emit duplicate registry files. Instead,
  # `make proto` invokes authz-registry-gen with -input pointing at a
  # FileDescriptorSet built by `buf build -o`. See the
  # proto-authz-registry target in Makefile.
  #
  # Spec: unified-identity-and-authorization Requirements 7.5, 14.1.
inputs:
  - directory: api/proto
    exclude_paths:
      - api/proto/common.proto
      - api/proto/google
