version: v2
modules:
  - path: api/proto
    name: buf.build/zeroroot-ai/sdk
    excludes:
      - api/proto/google
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
breaking:
  use:
    # WIRE_JSON is the breaking-change rule of the sdk (ADR-0028, rule 5).
    # Deployed components and the daemon talk over the binary wire and over
    # JSON. WIRE_JSON refuses each change that alters what a field number or a
    # JSON name means: a reused or renumbered field, a changed type, and a
    # renamed field. A field may be deleted when its number and its name are
    # reserved. No outside user compiles against the generated code, so the
    # names of generated source are not part of the contract.
    - WIRE_JSON
