version: v2
modules:
  - path: api/proto
    name: buf.build/zeroroot-ai/sdk
    excludes:
      - api/proto/google
deps:
  - buf.build/bufbuild/protovalidate
lint:
  use:
    - STANDARD
breaking:
  use:
    # FILE is the breaking-change rule of the sdk (ADR-0028, rule 5; sdk#208).
    # The sdk is the public component-developer surface, and its consumers
    # compile generated code. FILE refuses each change that breaks that code:
    # a renamed or moved field, message or file, and a deleted field, also
    # when its number is reserved. WIRE checked only the binary encoding.
    # scripts/proto-breaking-selftest.sh proves that a renamed field fails.
    - FILE
